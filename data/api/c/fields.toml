title = "Field Access"
slug = "fields"
summary = "Get, set and delete map fields"
description = "Functions for reading, writing and deleting the fields of a map, by integer key, by string key, or by an arbitrary key taken from the stack. They work on the map directly. To honour operator methods such as `[]` and `[]=`, use `tea_get_index` and `tea_set_index` from the Attribute Access section instead.\n\nThe `obj` index is always evaluated before any value is popped, so `-2` still refers to the same slot whether or not the key is popped by the call."

[[entry]]
name = "tea_get_fieldi"
kind = "function"
since = "1.0"
tags = ["field", "map", "integer"]
signature = "bool tea_get_fieldi(tea_State* T, int obj, tea_Integer i);"
summary = "Get by integer key"
description = "Pushes the value stored under the integer key `i` in the map at `obj`. Returns `true` if the key is present. If it is not, returns `false` and pushes nothing."
returns = "`true` if the field exists and was pushed; `false` otherwise."
stack = "[-0, +(1|0), -]"
example = '''
tea_new_map(T);                       /* [map] */
tea_push_integer(T, 42);
tea_set_fieldi(T, -2, 0);             /* map[0] = 42 */

bool ok = tea_get_fieldi(T, -1, 0);   /* ok = true, pushes 42 */
tea_pop(T, 1);
ok = tea_get_fieldi(T, -1, 7);        /* ok = false, nothing pushed */
'''
see_also = ["tea_set_fieldi", "tea_get_key", "tea_get_field"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

[[entry.params]]
name = "i"
desc = "Integer key to look up"

###

[[entry]]
name = "tea_set_fieldi"
kind = "function"
since = "1.0"
tags = ["field", "map", "integer"]
signature = "void tea_set_fieldi(tea_State* T, int obj, tea_Integer i);"
summary = "Set by integer key"
description = "Pops the value on top of the stack and stores it under the integer key `i` in the map at `obj`."
errors = "May raise a memory error."
stack = "[-1, +0, m]"
example = '''
tea_new_map(T);                  /* [map] */
tea_push_string(T, "zero");
tea_set_fieldi(T, -2, 0);        /* map[0] = "zero" */
tea_push_integer(T, 100);
tea_set_fieldi(T, -2, 1);        /* map[1] = 100 */
'''
see_also = ["tea_get_fieldi", "tea_set_key", "tea_set_field"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

[[entry.params]]
name = "i"
desc = "Integer key to assign"

###

[[entry]]
name = "tea_get_field"
kind = "function"
since = "1.0"
tags = ["field", "map"]
signature = "bool tea_get_field(tea_State* T, int obj);"
summary = "Get by stack key"
description = "Pops a key from the top of the stack and pushes the value stored under it in the map at `obj`. Returns `true` if the key is present. If it is not, returns `false` and pushes nothing; the key is popped either way."
returns = "`true` if the field exists and its value was pushed; `false` otherwise."
stack = "[-1, +(1|0), -]"
example = '''
tea_new_map(T);                       /* [map] */
tea_push_string(T, "Tea");
tea_set_key(T, -2, "name");           /* map["name"] = "Tea" */

tea_push_string(T, "name");           /* [map, "name"] */
bool ok = tea_get_field(T, -2);       /* ok = true, [map, "Tea"] */
'''
see_also = ["tea_set_field", "tea_get_key", "tea_get_fieldi"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

###

[[entry]]
name = "tea_set_field"
kind = "function"
since = "1.0"
tags = ["field", "map"]
signature = "void tea_set_field(tea_State* T, int obj);"
summary = "Set by stack key"
description = "Pops a value and a key from the stack and stores the value under that key in the map at `obj`. The value is on top, with the key just below it."
errors = "May raise a memory error."
stack = "[-2, +0, m]"
example = '''
tea_new_map(T);                  /* [map] */
tea_push_string(T, "count");
tea_push_integer(T, 7);
tea_set_field(T, -3);            /* map["count"] = 7 */
'''
see_also = ["tea_get_field", "tea_set_key", "tea_set_fieldi"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

###

[[entry]]
name = "tea_delete_field"
kind = "function"
since = "1.0"
tags = ["field", "map"]
signature = "bool tea_delete_field(tea_State* T, int obj);"
summary = "Delete by stack key"
description = "Pops a key from the top of the stack and removes the entry stored under it from the map at `obj`. Returns `true` if the key was present and has been removed, `false` otherwise."
returns = "`true` if an entry was removed; `false` otherwise."
stack = "[-1, +0, -]"
example = '''
tea_new_map(T);
tea_push_integer(T, 1);
tea_set_key(T, -2, "temp");               /* map["temp"] = 1 */

tea_push_string(T, "temp");
bool removed = tea_delete_field(T, -2);   /* removed = true, the map is empty */
'''
see_also = ["tea_set_field", "tea_delete_key"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

###

[[entry]]
name = "tea_get_key"
kind = "function"
since = "1.0"
tags = ["field", "map", "string"]
signature = "bool tea_get_key(tea_State* T, int obj, const char* key);"
summary = "Get by string key"
description = "Pushes the value stored under the string `key` in the map at `obj`. Returns `true` if the key is present. If it is not, returns `false` and pushes nothing."
returns = "`true` if the field exists and was pushed; `false` otherwise."
stack = "[-0, +(1|0), -]"
example = '''
tea_new_map(T);                             /* [map] */
tea_push_string(T, "1.0");
tea_set_key(T, -2, "version");              /* map["version"] = "1.0" */

bool ok = tea_get_key(T, -1, "version");    /* ok = true, pushes "1.0" */
tea_pop(T, 1);
ok = tea_get_key(T, -1, "missing");         /* ok = false, nothing pushed */
'''
see_also = ["tea_set_key", "tea_get_fieldi", "tea_get_field"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

[[entry.params]]
name = "key"
desc = "NUL-terminated string key to look up"

###

[[entry]]
name = "tea_set_key"
kind = "function"
since = "1.0"
tags = ["field", "map", "string"]
signature = "void tea_set_key(tea_State* T, int obj, const char* key);"
summary = "Set by string key"
description = "Pops the value on top of the stack and stores it under the string `key` in the map at `obj`. Only the value is popped: the key is given as a C string, not taken from the stack."
errors = "May raise a memory error."
stack = "[-1, +0, m]"
example = '''
tea_new_map(T);
tea_push_integer(T, 3);
tea_set_key(T, -2, "x");    /* map["x"] = 3 */
tea_push_integer(T, 4);
tea_set_key(T, -2, "y");    /* map["y"] = 4 */
'''
see_also = ["tea_get_key", "tea_set_fieldi", "tea_set_field"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

[[entry.params]]
name = "key"
desc = "NUL-terminated string key to assign"

###

[[entry]]
name = "tea_delete_key"
kind = "function"
since = "1.0"
tags = ["field", "map", "string"]
signature = "bool tea_delete_key(tea_State* T, int obj, const char* key);"
summary = "Delete by string key"
description = "Removes the entry stored under the string `key` from the map at `obj`. Returns `true` if the key was present and has been removed, `false` otherwise."
returns = "`true` if an entry was removed; `false` otherwise."
stack = "[-0, +0, -]"
example = '''
tea_new_map(T);
tea_push_integer(T, 5);
tea_set_key(T, -2, "score");                      /* map["score"] = 5 */

bool removed = tea_delete_key(T, -1, "score");    /* removed = true */
removed = tea_delete_key(T, -1, "score");         /* removed = false */
'''
see_also = ["tea_set_key", "tea_delete_field"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the map"

[[entry.params]]
name = "key"
desc = "NUL-terminated string key to delete"
