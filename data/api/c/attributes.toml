title = "Attribute Access"
slug = "attributes"
summary = "Attributes and index operators"
description = "Functions for accessing the attributes of an object (`obj.key`) and for indexing it (`obj[key]`). Unlike the Field Access functions, which work on the map directly, these respect the object's special methods: they may call getters, setters and the `[]` and `[]=` operator methods, so they can run Teascript code and raise errors."

[[entry]]
name = "tea_has_attr"
kind = "function"
since = "1.0"
tags = ["attr"]
signature = "bool tea_has_attr(tea_State* T, int obj, const char* key);"
summary = "Has attribute"
description = "Checks whether the object at `obj` has an attribute named `key`."
returns = "`true` if the attribute exists; `false` otherwise."
stack = "[-0, +0, -]"
example = '''
tea_new_module(T, "mymod");
tea_push_integer(T, 42);
tea_set_attr(T, -2, "answer");

bool has = tea_has_attr(T, -1, "answer");    /* true */
has = tea_has_attr(T, -1, "missing");        /* false */
'''
see_also = ["tea_get_attr", "tea_set_attr", "tea_delete_attr"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the object"

[[entry.params]]
name = "key"
desc = "Name of the attribute to look up"

###

[[entry]]
name = "tea_get_attr"
kind = "function"
since = "1.0"
tags = ["attr"]
signature = "void tea_get_attr(tea_State* T, int obj, const char* key);"
summary = "Get attribute"
description = "Pushes the value of the attribute `key` of the object at `obj`. This respects the object's special methods, so it may call a getter."
stack = "[-0, +1, e]"
example = '''
tea_new_module(T, "mymod");
tea_push_integer(T, 7);
tea_set_attr(T, -2, "version");

tea_get_attr(T, -1, "version");   /* pushes 7 */
'''
see_also = ["tea_set_attr", "tea_has_attr", "tea_get_key"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the object"

[[entry.params]]
name = "key"
desc = "Name of the attribute to retrieve"

###

[[entry]]
name = "tea_set_attr"
kind = "function"
since = "1.0"
tags = ["attr"]
signature = "void tea_set_attr(tea_State* T, int obj, const char* key);"
summary = "Set attribute"
description = "Pops the value on top of the stack and assigns it to the attribute `key` of the object at `obj`. This respects the object's special methods, so it may call a setter, or have no effect if the attribute is read-only."
stack = "[-1, +0, e]"
example = '''
tea_new_module(T, "mymod");       /* [module] */
tea_push_integer(T, 1);
tea_set_attr(T, -2, "version");   /* module.version = 1 */
tea_push_string(T, "beta");
tea_set_attr(T, -2, "channel");   /* module.channel = "beta" */
'''
see_also = ["tea_get_attr", "tea_delete_attr", "tea_set_key"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the object"

[[entry.params]]
name = "key"
desc = "Name of the attribute to set"

###

[[entry]]
name = "tea_delete_attr"
kind = "function"
since = "1.0"
tags = ["attr"]
signature = "void tea_delete_attr(tea_State* T, int obj, const char* key);"
summary = "Delete attribute"
description = "Deletes the attribute `key` from the object at `obj`."
stack = "[-0, +0, e]"
example = '''
tea_new_module(T, "mymod");
tea_push_integer(T, 1);
tea_set_attr(T, -2, "version");

tea_delete_attr(T, -1, "version");   /* module.version is removed */
'''
see_also = ["tea_set_attr", "tea_has_attr", "tea_delete_key"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the object"

[[entry.params]]
name = "key"
desc = "Name of the attribute to delete"

###

[[entry]]
name = "tea_get_index"
kind = "function"
since = "1.0"
tags = ["index"]
signature = "void tea_get_index(tea_State* T, int obj);"
summary = "Index (obj[key])"
description = "Pops a key from the top of the stack and pushes the result of indexing the object at `obj` with it, using the `[]` operator method if there is one. It is the equivalent of `obj[key]` in Teascript."
stack = "[-1, +1, e]"
example = '''
tea_new_map(T);                   /* [map] */
tea_push_string(T, "Tea");
tea_set_key(T, -2, "name");       /* map["name"] = "Tea" */

tea_push_string(T, "name");       /* [map, "name"] */
tea_get_index(T, -2);             /* [map, "Tea"] */
'''
see_also = ["tea_set_index", "tea_get_key", "tea_get_item"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the object to index"

###

[[entry]]
name = "tea_set_index"
kind = "function"
since = "1.0"
tags = ["index"]
signature = "void tea_set_index(tea_State* T, int obj);"
summary = "Assign index (obj[key] = v)"
description = "Pops a value and a key from the stack and performs `obj[key] = value` on the object at `obj`, using the `[]=` operator method if there is one. The value is on top, with the key just below it."
stack = "[-2, +0, e]"
example = '''
tea_new_map(T);                   /* [map] */
tea_push_string(T, "lang");
tea_push_string(T, "Tea");
tea_set_index(T, -3);             /* map["lang"] = "Tea" */
'''
see_also = ["tea_get_index", "tea_set_key", "tea_set_item"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "obj"
desc = "Stack index of the object to index"
