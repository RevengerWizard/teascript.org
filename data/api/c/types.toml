[[entry]]
name = "tea_is_object"
kind = "function"
since = "1.0"
tags = ["type", "object"]
signature = "bool tea_is_object(tea_State* T, int index);"
summary = "Is heap object"
description = "Returns `true` if the value at `index` is a garbage-collected object, as opposed to a plain value such as `nil`, a boolean, a number or a raw pointer."
returns = "`true` if the value is an object; `false` otherwise, including for an invalid index."
stack = "[-0, +0, -]"
