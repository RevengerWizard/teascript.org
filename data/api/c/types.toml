summary = "Type mask"
description = "Returns the type mask of the value at `index`, the `TEA_MASK_*` constant that corresponds to its type. This is `1 << tea_get_type(T, index)`."
returns = "One of the `TEA_MASK_*` constants."
stack = "[-0, +0, -]"
