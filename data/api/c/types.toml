since = "1.0"
tags = ["type", "mask", "macro"]
signature = "#define tea_is_mask(T, n, m) (tea_get_mask(T, (n)) & (m))"
summary = "Test against mask"
description = "Tests whether the type of the value at `n` is one of the types in the mask `m`. The result is the masked value, so it is non-zero when the test passes; it is not necessarily `1`."
