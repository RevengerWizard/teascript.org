signature = "int tea_get_type(tea_State* T, int index);"
summary = "Type code"
description = "Returns the type of the value at `index` as one of the `TEA_TYPE_*` constants. If the index holds no value, `TEA_TYPE_NONE` is returned."
returns = "One of the `TEA_TYPE_*` constants."
