[[entry]]
name = "tea_typeof"
kind = "function"
since = "1.0"
tags = ["type", "string"]
signature = "const char* tea_typeof(tea_State* T, int index);"
summary = "Type name"
description = "Returns the name of the type of the value at `index` as a NUL-terminated C string (for example `\"number\"`, `\"string\"` or `\"list\"`). If the index holds no value, the string `\"no value\"` is returned.\n\nThe string belongs to the interpreter and must not be modified. It is meant for diagnostics, error messages and debugging output."
returns = "The type name of the value at `index`."
stack = "[-0, +0, -]"
example = '''
tea_push_number(T, 1);
printf("%s\n", tea_typeof(T, -1));   /* number */
'''
see_also = ["tea_get_type", "tea_type_error"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value"

