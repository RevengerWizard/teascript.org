signature = "bool tea_equal(tea_State* T, int index1, int index2);"
summary = "Compare values"
description = "Returns `true` if the values at `index1` and `index2` are equal according to the `==` operator of Teascript, which may call an equality method. Use `tea_rawequal` to compare without calling any method."
