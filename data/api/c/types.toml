title = "Types"
slug = "types"
summary = "Type codes and type queries"
description = "The type codes and masks used by the C API, and the functions and macros that inspect the type of a value on the stack or compare two values. None of them raise errors on a type mismatch: they only report. To validate arguments and raise an error instead, see the Argument Checking section.\n\nAn index that holds no value (past the top of the stack) has type `TEA_TYPE_NONE`, which is different from the Teascript value `nil` (`TEA_TYPE_NIL`)."

[[entry]]
name = "TEA_TYPE_NONE"
kind = "enum"
since = "1.0"
tags = ["type", "enum"]
signature = '''
enum
{
    TEA_TYPE_NONE,
    TEA_TYPE_NIL,
    TEA_TYPE_BOOL,
    TEA_TYPE_NUMBER,
    TEA_TYPE_POINTER,
    TEA_TYPE_STRING,
    TEA_TYPE_RANGE,
    TEA_TYPE_FUNCTION,
    TEA_TYPE_MODULE,
    TEA_TYPE_CLASS,
    TEA_TYPE_INSTANCE,
    TEA_TYPE_LIST,
    TEA_TYPE_MAP,
    TEA_TYPE_USERDATA,
};
'''
summary = "Basic type codes"
description = '''
The codes returned by `tea_get_type` and accepted by `tea_check_type`. The values are consecutive, starting at `0`.

| Code | Value |
|---|---|
| `TEA_TYPE_NONE` | No value (empty or invalid index) |
| `TEA_TYPE_NIL` | `nil` |
| `TEA_TYPE_BOOL` | Boolean |
| `TEA_TYPE_NUMBER` | Number |
| `TEA_TYPE_POINTER` | Raw C pointer |
| `TEA_TYPE_STRING` | String |
| `TEA_TYPE_RANGE` | Range |
| `TEA_TYPE_FUNCTION` | Function |
| `TEA_TYPE_MODULE` | Module |
| `TEA_TYPE_CLASS` | Class |
| `TEA_TYPE_INSTANCE` | Class instance |
| `TEA_TYPE_LIST` | List |
| `TEA_TYPE_MAP` | Map |
| `TEA_TYPE_USERDATA` | Userdata |
'''
example = '''
switch(tea_get_type(T, 1))
{
    case TEA_TYPE_NUMBER: /* ... */ break;
    case TEA_TYPE_STRING: /* ... */ break;
    default:              /* ... */ break;
}
'''
see_also = ["tea_get_type", "tea_check_type", "TEA_MASK_NONE"]

###

[[entry]]
name = "TEA_MASK_NONE"
kind = "const"
since = "1.0"
tags = ["type", "mask", "const"]
signature = "#define TEA_MASK_<TYPE> (1 << TEA_TYPE_<TYPE>)"
summary = "Type bit masks"
description = "One bit mask per basic type, each defined as `1 << TEA_TYPE_x`: `TEA_MASK_NONE`, `TEA_MASK_NIL`, `TEA_MASK_BOOL`, `TEA_MASK_NUMBER`, `TEA_MASK_POINTER`, `TEA_MASK_STRING`, `TEA_MASK_RANGE`, `TEA_MASK_FUNCTION`, `TEA_MASK_MODULE`, `TEA_MASK_CLASS`, `TEA_MASK_INSTANCE`, `TEA_MASK_LIST`, `TEA_MASK_MAP` and `TEA_MASK_USERDATA`.\n\nMasks can be combined with `|` and tested against a value with `tea_is_mask`, which makes it easy to accept several types at once."
example = '''
/* accept a list or a map */
if(!tea_is_mask(T, 1, TEA_MASK_LIST | TEA_MASK_MAP))
    tea_type_error(T, 1, "list or map");
'''
see_also = ["tea_get_mask", "tea_is_mask", "TEA_TYPE_NONE"]

