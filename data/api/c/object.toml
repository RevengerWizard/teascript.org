title = "Object Creation"
slug = "object"
summary = "Create lists, maps, classes, modules, userdata"
description = "Functions that create new objects and push them onto the stack: lists, maps, classes, modules and userdata. The `tea_create_*` variants also fill in the new class or module from a registration array in one call. Creating an object allocates memory, so every function here can raise a memory error."

[[entry]]
name = "tea_new_list"
kind = "function"
since = "1.0"
tags = ["object", "list"]
signature = "void tea_new_list(tea_State* T, size_t n);"
summary = "New list"
description = "Creates a new, empty list and pushes it onto the stack. `n` is the capacity to prepare, a hint that avoids reallocations during later `tea_add_item` calls; it does not set the list's length."
stack = "[-0, +1, m]"
example = '''
tea_new_list(T, 4);          /* [] with room for 4 items */

for(int i = 0; i < 3; i++)
{
    tea_push_integer(T, i * 10);
    tea_add_item(T, -2);
}
/* the list is now [0, 10, 20] */
'''
see_also = ["tea_new_map", "tea_add_item", "tea_insert_item"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "n"
desc = "Initial capacity hint"

