[[entry]]
name = "tea_set_udvalue"
kind = "function"
since = "1.0"
tags = ["object", "userdata"]
signature = "void tea_set_udvalue(tea_State* T, int ud, int n);"
summary = "Set userdata uservalue"
description = "Pops the value on top of the stack and stores it as the `n`-th user value of the userdata at `ud`. The userdata must have been created with at least `n + 1` user values (see `tea_new_userdatav`)."
stack = "[-1, +0, -]"
example = '''
tea_new_userdatav(T, sizeof(int), 2);   /* [ud] */
tea_push_string(T, "tag");
tea_set_udvalue(T, -2, 0);              /* user value 0 = "tag" */
tea_push_integer(T, 7);
tea_set_udvalue(T, -2, 1);              /* user value 1 = 7 */
'''
see_also = ["tea_get_udvalue", "tea_new_userdatav", "tea_new_udatav"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "ud"
desc = "Stack index of the userdata"

[[entry.params]]
name = "n"
desc = "Zero-based number of the user value"
