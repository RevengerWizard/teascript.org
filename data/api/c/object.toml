since = "1.0"
tags = ["object", "class"]
signature = "void tea_new_class(tea_State* T, const char* name);"
summary = "New class"
description = "Creates a new, empty class called `name` and pushes it onto the stack. Add methods with `tea_set_methods` or one at a time with `tea_set_attr`."
