[[entry]]
name = "tea_new_userdata"
kind = "function"
since = "1.0"
tags = ["object", "userdata"]
signature = "void* tea_new_userdata(tea_State* T, size_t size);"
summary = "New userdata"
description = "Creates a new anonymous userdata with a data block of `size` bytes and no user values, and pushes it onto the stack. Equivalent to `tea_new_userdatav(T, size, 0)`.\n\nThe block is managed by the garbage collector. Use `tea_set_finalizer` to release any native resources it refers to."
returns = "A pointer to the data block, valid for as long as the userdata is alive."
stack = "[-0, +1, m]"
example = '''
void* buf = tea_new_userdata(T, 256);
memset(buf, 0, 256);
'''
see_also = ["tea_new_userdatav", "tea_new_udata", "tea_set_finalizer"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "size"
desc = "Size of the data block in bytes"

###

[[entry]]
name = "tea_new_userdatav"
kind = "function"
since = "1.0"
tags = ["object", "userdata"]
signature = "void* tea_new_userdatav(tea_State* T, size_t size, int nuvs);"
summary = "New userdata with uservalues"
description = "Creates a new anonymous userdata with a data block of `size` bytes and `nuvs` user values, all initially `nil`, and pushes it onto the stack. The user values hold Teascript values that live and die with the userdata; access them with `tea_get_udvalue` and `tea_set_udvalue`. Unlike `tea_new_udatav`, the userdata has no class."
returns = "A pointer to the data block, valid for as long as the userdata is alive."
stack = "[-0, +1, m]"
example = '''
/* a userdata holding one int and one user value */
int* p = (int*)tea_new_userdatav(T, sizeof(int), 1);
*p = 42;
'''
see_also = ["tea_new_userdata", "tea_new_udatav", "tea_set_udvalue"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "size"
desc = "Size of the data block in bytes"

[[entry.params]]
name = "nuvs"
desc = "Number of user values"

###

[[entry]]
name = "tea_new_udata"
kind = "function"
since = "1.0"
tags = ["object", "userdata", "class"]
signature = "void* tea_new_udata(tea_State* T, size_t size, const char* name);"
summary = "New typed userdata"
description = "Creates a new userdata with a data block of `size` bytes and no user values, associated with the class registered under `name`, and pushes it onto the stack. Equivalent to `tea_new_udatav(T, size, 0, name)`. The class association is what lets `tea_check_udata` and `tea_test_udata` verify the type later."
returns = "A pointer to the data block, valid for as long as the userdata is alive."
stack = "[-0, +1, m]"
example = '''
FILE** f = (FILE**)tea_new_udata(T, sizeof(FILE*), "File");
*f = fopen("data.txt", "r");
'''
see_also = ["tea_new_udatav", "tea_new_userdata", "tea_check_udata"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "size"
desc = "Size of the data block in bytes"

[[entry.params]]
name = "name"
desc = "Name of the registered class to associate"

###

[[entry]]
name = "tea_new_udatav"
kind = "function"
since = "1.0"
tags = ["object", "userdata", "class"]
signature = "void* tea_new_udatav(tea_State* T, size_t size, int nuvs, const char* name);"
summary = "New typed userdata with uservalues"
description = "Creates a new userdata with a data block of `size` bytes and `nuvs` user values, associated with the class registered under `name` (typically created with `tea_new_class` or `tea_create_class`), and pushes it onto the stack. The class association enables type checking with `tea_check_udata` and `tea_test_udata`."
returns = "A pointer to the data block, valid for as long as the userdata is alive."
stack = "[-0, +1, m]"
example = '''
/* a "RingBuffer" userdata with two user values */
RingBuffer* rb = (RingBuffer*)tea_new_udatav(T, sizeof(RingBuffer), 2, "RingBuffer");
rb->capacity = 16;
'''
see_also = ["tea_new_userdatav", "tea_new_udata", "tea_check_udata", "tea_create_class"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "size"
desc = "Size of the data block in bytes"

[[entry.params]]
name = "nuvs"
desc = "Number of user values"

[[entry.params]]
name = "name"
desc = "Name of the registered class to associate"

