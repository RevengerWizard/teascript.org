since = "1.0"
tags = ["object", "map"]
signature = "void tea_new_map(tea_State* T);"
summary = "New map"
description = "Creates a new, empty map and pushes it onto the stack."
stack = "[-0, +1, m]"
example = '''
tea_new_map(T);                    /* {} */
tea_push_string(T, "hello");
tea_set_key(T, -2, "greeting");    /* {greeting = "hello"} */
'''
