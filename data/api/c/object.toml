[[entry]]
name = "tea_create_class"
kind = "function"
since = "1.0"
tags = ["object", "class"]
signature = "void tea_create_class(tea_State* T, const char* name, const tea_Methods* klass);"
summary = "New class with methods"
description = "Creates a new class called `name`, registers every method described by the `tea_Methods` array `klass`, and pushes the class onto the stack. Each entry gives a method name, its type (`\"method\"`, `\"static\"`, `\"getter\"` or `\"setter\"`), the C function and the argument counts. The array ends with an entry whose name is `NULL`."
stack = "[-0, +1, m]"
example = '''
static const tea_Methods point_methods[] =
{
    {"new",    "method", point_new,    2, 0},
    {"length", "method", point_length, 0, 0},
    {"x",      "getter", point_getx,   0, 0},
    {NULL, NULL, NULL, 0, 0}
};

tea_create_class(T, "Point", point_methods);
tea_set_global(T, "Point");
'''
see_also = ["tea_new_class", "tea_set_methods", "tea_Methods"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "name"
desc = "Name of the class"

[[entry.params]]
name = "klass"
desc = "`NULL`-terminated array of method descriptors; may be `NULL` for an empty class"

