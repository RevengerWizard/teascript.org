[[entry]]
name = "tea_create_module"
kind = "function"
since = "1.0"
tags = ["object", "module"]
signature = "void tea_create_module(tea_State* T, const char* name, const tea_Reg* module);"
summary = "New module with functions"
description = "Creates a new module called `name`, fills it with the functions described by the `tea_Reg` array `module`, and pushes it onto the stack. Each entry gives a name, a C function and the argument counts. An entry with a `NULL` function stores `nil` under its name, which is useful as a placeholder to fill in afterwards. The array ends with an entry whose name is `NULL`."
stack = "[-0, +1, m]"
example = '''
static const tea_Reg mathx_lib[] =
{
    {"sqrt", mathx_sqrt, 1, 0},
    {"pi",   NULL,       0, 0},      /* placeholder */
    {NULL, NULL, 0, 0}
};

tea_create_module(T, "mathx", mathx_lib);
tea_push_number(T, 3.14159);
tea_set_attr(T, -2, "pi");           /* fill in the placeholder */
tea_set_global(T, "mathx");
'''
see_also = ["tea_new_module", "tea_create_submodule", "tea_set_funcs", "tea_Reg"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "name"
desc = "Name of the module"

[[entry.params]]
name = "module"
desc = "`NULL`-terminated array of function descriptors; may be `NULL` for an empty module"

###

[[entry]]
name = "tea_create_submodule"
kind = "function"
since = "1.0"
tags = ["object", "module"]
signature = "void tea_create_submodule(tea_State* T, const char* name, const tea_Reg* module);"
summary = "New submodule with functions"
description = "Like `tea_create_module`, but creates a submodule meant to be nested inside another module. Assign it to the parent with `tea_set_attr`."
stack = "[-0, +1, m]"
example = '''
static const tea_Reg path_lib[] =
{
    {"join",  path_join,  TEA_VARG, 0},
    {"split", path_split, 1,        0},
    {NULL, NULL, 0, 0}
};

tea_create_submodule(T, "path", path_lib);   /* [path] */
tea_get_global(T, "os");                     /* [path, os] */
tea_insert(T, -2);                           /* [os, path] */
tea_set_attr(T, -2, "path");                 /* os.path = path; [os] */
tea_pop(T, 1);
'''
see_also = ["tea_new_submodule", "tea_create_module"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "name"
desc = "Name of the submodule"

[[entry.params]]
name = "module"
desc = "`NULL`-terminated array of function descriptors; may be `NULL` for an empty submodule"

