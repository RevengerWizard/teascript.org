[[entry]]
name = "tea_to_cfunction"
kind = "function"
since = "1.0"
tags = ["conv", "cfunction"]
signature = "tea_CFunction tea_to_cfunction(tea_State* T, int index);"
summary = "Convert to C function"
description = "Returns the C function stored in the value at `index`, if the value is a C function or a C closure. Otherwise returns `NULL`."
returns = "The `tea_CFunction`, or `NULL` if the value is not a C function."
stack = "[-0, +0, -]"
example = '''
static void my_cfunc(tea_State* T) { /* ... */ }

tea_push_cfunction(T, my_cfunc, 0, 0);
tea_CFunction f = tea_to_cfunction(T, -1);   /* f == my_cfunc */
'''
see_also = ["tea_check_cfunction", "tea_is_cfunction"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value to convert"
