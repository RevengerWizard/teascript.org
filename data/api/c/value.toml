[[entry]]
name = "tea_to_numberx"
kind = "function"
since = "1.0"
tags = ["conv", "number"]
signature = "tea_Number tea_to_numberx(tea_State* T, int index, bool* is_num);"
summary = "Convert to number (flag)"
description = "Converts the value at `index` to a number. Numbers convert to themselves, and strings that hold a valid number are parsed. If `is_num` is not `NULL`, it is set to `true` when the conversion succeeded and `false` otherwise."
returns = "The converted number, or `0` if the value cannot be converted."
stack = "[-0, +0, -]"
example = '''
tea_push_string(T, "42");
bool ok;
tea_Number n = tea_to_numberx(T, -1, &ok);   /* n = 42, ok = true */

tea_push_string(T, "hello");
n = tea_to_numberx(T, -1, &ok);              /* n = 0, ok = false */
'''
see_also = ["tea_to_number", "tea_to_integerx", "tea_get_number"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value to convert"

[[entry.params]]
name = "is_num"
desc = "Receives whether the conversion succeeded, or `NULL`"

