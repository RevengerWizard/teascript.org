[[entry]]
name = "tea_to_lstring"
kind = "function"
since = "1.0"
tags = ["conv", "string"]
signature = "const char* tea_to_lstring(tea_State* T, int index, size_t* len);"
summary = "Convert to string and length"
description = "Converts the value at `index` to a string using Teascript's generic string conversion, which honors a `__tostring` method on instances and userdata. **The resulting string is pushed onto the stack**, and a pointer to its data is returned. If `len` is not `NULL`, the length is stored in `*len`.\n\nThe pointer stays valid while the string is on the stack, so pop the string only after you are done with it. The original value is left untouched."
returns = "A pointer to the string data, or `NULL` if `index` holds no value."
stack = "[-0, +1, e]"
example = '''
tea_push_integer(T, 1234);

size_t len;
const char* s = tea_to_lstring(T, -1, &len);   /* s = "1234", len = 4 */
/* the stack is now [1234, "1234"] */
printf("%.*s\n", (int)len, s);
tea_pop(T, 1);                                 /* drop the string */
'''
see_also = ["tea_to_string", "tea_get_lstring", "tea_push_fstring"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value to convert"

[[entry.params]]
name = "len"
desc = "Receives the string length, or `NULL`"

