[[entry]]
name = "tea_to_pointer"
kind = "function"
since = "1.0"
tags = ["conv", "pointer"]
signature = "const void* tea_to_pointer(tea_State* T, int index);"
summary = "Convert to pointer"
description = "Converts the value at `index` to a generic C pointer. Raw pointers convert to themselves; for other values the result depends on the type. Returns `NULL` if the value cannot be converted.\n\nThe result is intended for identity checks and debugging, not for dereferencing."
returns = "A pointer representing the value, or `NULL` on failure."
stack = "[-0, +0, -]"
example = '''
int x;
tea_push_pointer(T, &x);
const void* p = tea_to_pointer(T, -1);   /* p == &x */
'''
see_also = ["tea_get_pointer", "tea_check_pointer"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value to convert"

