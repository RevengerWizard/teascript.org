title = "Value Conversion"
slug = "value"
summary = "Lenient stack-to-C conversions"
description = "Functions that convert a value on the stack into a native C value. Unlike the `tea_check_*` family, they never raise an error on a type mismatch: they convert when possible and otherwise return a safe default (`0`, `NULL` or `false`). The `x` variants also report whether the conversion succeeded.\n\nThe string conversions are different in one respect: `tea_to_string` and `tea_to_lstring` **push** the resulting string onto the stack, so remember to pop it when you are done."

[[entry]]
name = "tea_to_bool"
kind = "function"
since = "1.0"
tags = ["conv", "bool"]
signature = "bool tea_to_bool(tea_State* T, int index);"
summary = "Convert to boolean"
description = "Converts the value at `index` to a C boolean using Teascript truthiness: `nil` and `false` give `false`, and every other value, including `0` and the empty string, gives `true`."
returns = "The boolean result. `false` if `index` is invalid or holds no value."
stack = "[-0, +0, -]"
example = '''
tea_push_number(T, 0);
tea_push_nil(T);

bool a = tea_to_bool(T, -2);   /* true  (0 is truthy) */
bool b = tea_to_bool(T, -1);   /* false (nil is falsy) */
'''
see_also = ["tea_get_bool", "tea_check_bool"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value to convert"

