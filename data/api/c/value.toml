[[entry]]
name = "tea_to_userdata"
kind = "function"
since = "1.0"
tags = ["conv", "userdata"]
signature = "void* tea_to_userdata(tea_State* T, int index);"
summary = "Convert to userdata pointer"
description = "Returns the data block of the userdata at `index`. If the value is a raw pointer, that pointer is returned instead. For any other type, or an invalid index, returns `NULL`."
returns = "The userdata's data block, the raw pointer, or `NULL`."
stack = "[-0, +0, -]"
example = '''
int* data = (int*)tea_new_userdata(T, sizeof(int));
*data = 99;

void* p = tea_to_userdata(T, -1);   /* p == data */
'''
see_also = ["tea_get_userdata", "tea_check_userdata"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value to convert"

