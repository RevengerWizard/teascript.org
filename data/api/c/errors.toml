[[entry]]
name = "tea_arg_error"
kind = "function"
since = "1.0"
tags = ["error", "check"]
signature = "int tea_arg_error(tea_State* T, int narg, const char* msg);"
summary = "Bad argument error"
description = "Raises a \"bad argument #`narg`\" error that includes `msg`. This is the general-purpose argument error, for problems that are not type mismatches (for those, `tea_type_error` is more appropriate).\n\nAs with `tea_error`, the `int` return type only allows `return tea_arg_error(...)` or use inside `tea_arg_check`."
errors = "Always raises an error; never returns normally."
stack = "[-0, +0, v]"
example = '''
static void set_name(tea_State* T)
{
    const char* name = tea_check_string(T, 1);
    if(name[0] == '\0')
        tea_arg_error(T, 1, "name must not be empty");
    /* ... */
}
'''
see_also = ["tea_type_error", "tea_arglimit_error", "tea_arg_check"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "narg"
desc = "Number of the offending argument"

[[entry.params]]
name = "msg"
desc = "Message describing the problem"

