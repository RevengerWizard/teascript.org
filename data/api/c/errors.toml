[[entry]]
name = "tea_type_error"
kind = "function"
since = "1.0"
tags = ["error", "type", "check"]
signature = "int tea_type_error(tea_State* T, int narg, const char* xname);"
summary = "Argument type error"
description = "Raises a \"bad argument #`narg`\" error for a type mismatch. `xname` is the name of the expected type or userdata class, and is inserted into the message together with the actual type, as in `string expected, got number`."
errors = "Always raises an error; never returns normally."
stack = "[-0, +0, v]"
example = '''
static void connect(tea_State* T)
{
    if(!tea_test_udata(T, 1, "Socket"))
        tea_type_error(T, 1, "Socket");
    /* ... */
}
'''
see_also = ["tea_arg_error", "tea_arglimit_error", "tea_test_udata"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "narg"
desc = "Number of the offending argument"

[[entry.params]]
name = "xname"
desc = "Name of the expected type or class"

