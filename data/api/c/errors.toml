[[entry]]
name = "tea_arglimit_error"
kind = "function"
since = "1.0"
tags = ["error", "check"]
signature = "int tea_arglimit_error(tea_State* T, int narg, const char* msg);"
summary = "Argument out of range"
description = "Raises an error saying that argument `narg` is outside the acceptable range, for example when a number exceeds a permitted maximum. `msg` describes the limit. The message carries the same \"bad argument #`narg`\" prefix as `tea_arg_error`."
errors = "Always raises an error; never returns normally."
stack = "[-0, +0, v]"
example = '''
static void set_quality(tea_State* T)
{
    tea_Integer q = tea_check_integer(T, 1);
    if(q < 0 || q > 100)
        tea_arglimit_error(T, 1, "quality must be in range [0, 100]");
    /* ... */
}
'''
see_also = ["tea_arg_error", "tea_type_error"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "narg"
desc = "Number of the offending argument"

[[entry.params]]
name = "msg"
desc = "Message describing the violated limit"

