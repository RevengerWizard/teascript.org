[[entry]]
name = "tea_arg_check"
kind = "macro"
since = "1.0"
tags = ["error", "check", "macro"]
signature = "#define tea_arg_check(T, cond, narg, extramsg) ((void)((cond) || tea_arg_error(T, (narg), (extramsg))))"
summary = "Assert argument condition"
description = "Checks that `cond` is true and otherwise raises a bad argument error for argument `narg` with `extramsg`, by calling `tea_arg_error`. `cond` is evaluated exactly once."
errors = "Raises an error if `cond` is false."
stack = "[-0, +0, v]"
example = '''
static void set_volume(tea_State* T)
{
    tea_Integer v = tea_check_integer(T, 1);
    tea_arg_check(T, v >= 0 && v <= 10, 1, "volume must be in range [0, 10]");
    /* ... */
}
'''
see_also = ["tea_arg_error", "tea_arglimit_error"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "cond"
desc = "Condition that must hold"

[[entry.params]]
name = "narg"
desc = "Number of the argument being checked"

[[entry.params]]
name = "extramsg"
desc = "Message used if the condition is false"
