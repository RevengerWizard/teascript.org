[[entry]]
name = "tea_opt_bool"
kind = "function"
since = "1.0"
tags = ["opt", "bool"]
signature = "bool tea_opt_bool(tea_State* T, int index, bool def);"
summary = "Optional boolean"
description = "Returns the boolean at `index`, or `def` if the argument is absent."
returns = "The boolean at `index`, or `def`."
errors = "Raises a type error if the argument is present but is not a boolean."
stack = "[-0, +0, v]"
example = '''
static void greet(tea_State* T)
{
    const char* name = tea_check_string(T, 1);
    bool loud = tea_opt_bool(T, 2, false);
    if(loud)
        tea_push_fstring(T, "HELLO, %s!", name);
    else
        tea_push_fstring(T, "Hello, %s.", name);
}
'''
see_also = ["tea_check_bool", "tea_get_bool"]

