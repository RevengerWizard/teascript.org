[[entry]]
name = "tea_opt_lstring"
kind = "function"
since = "1.0"
tags = ["opt", "string"]
signature = "const char* tea_opt_lstring(tea_State* T, int index, const char* def, size_t* len);"
summary = "Optional string and length"
description = "Returns the string at `index`, with its length stored in `*len`, or `def` if the argument is absent. In that case the length is `strlen(def)`, or `0` if `def` is `NULL`.\n\nUse this variant when the string may contain embedded zero bytes."
returns = "A pointer to the string data, or `def`."
errors = "Raises a type error if the argument is present but is not a string."
stack = "[-0, +0, v]"
example = '''
size_t len;
const char* sep = tea_opt_lstring(T, 2, ", ", &len);
/* sep is ", " and len is 2 if argument 2 is absent */
'''
see_also = ["tea_check_lstring", "tea_opt_string"]

