since = "1.0"
tags = ["opt", "string"]
signature = "const char* tea_opt_string(tea_State* T, int index, const char* def);"
summary = "Optional string"
description = "Returns the string at `index`, or `def` if the argument is absent.\n\nUse `tea_opt_lstring` if the string may contain embedded zero bytes."
returns = "A pointer to the string data, or `def`."
errors = "Raises a type error if the argument is present but is not a string."
stack = "[-0, +0, v]"
example = '''
static void log_message(tea_State* T)
{
    const char* msg = tea_check_string(T, 1);
    const char* prefix = tea_opt_string(T, 2, "[info]");
    tea_push_fstring(T, "%s %s", prefix, msg);
}
'''
see_also = ["tea_check_string", "tea_opt_lstring"]

