[[entry]]
name = "tea_opt_userdata"
kind = "function"
since = "1.0"
tags = ["opt", "userdata"]
signature = "void* tea_opt_userdata(tea_State* T, int index, void* def);"
summary = "Optional userdata"
description = "Returns a pointer to the data block of the userdata at `index`, or `def` if the argument is absent or `nil`.\n\nThe userdata's class is not checked. When a particular class is required, use `tea_test_udata` or `tea_check_udata`."
returns = "A pointer to the userdata's data block, or `def`."
errors = "Raises a type error if the argument is present but is not a userdata."
stack = "[-0, +0, v]"
example = '''
static void attach(tea_State* T)
{
    void* widget = tea_check_userdata(T, 1);
    void* parent = tea_opt_userdata(T, 2, NULL);
    attach_widget(widget, parent);   /* parent may be NULL */
}
'''
see_also = ["tea_check_userdata", "tea_opt_pointer", "tea_test_udata"]

