title = "Optional Arguments"
slug = "optionals"
summary = "Read optional arguments with defaults"
description = "Functions for reading optional arguments in a C function. Each `tea_opt_*` function returns the argument at `index` converted to a C value, exactly as the matching `tea_check_*` function would, or the default `def` if the argument is absent. If the argument is present but has the wrong type, a type error is raised.\n\nThe number of optional arguments a function accepts is declared when the function is pushed (the `nopts` parameter of `tea_push_cfunction`)."

[[entry]]
name = "tea_opt_nil"
kind = "function"
since = "1.0"
tags = ["opt", "nil"]
signature = "void tea_opt_nil(tea_State* T, int index);"
summary = "Default to nil"
description = "If the argument at `index` is absent, pushes `nil` in its place. Otherwise does nothing. This normalizes an optional argument slot so that later stack operations can count on a concrete value being there."
stack = "[-0, +(1|0), -]"
example = '''
tea_opt_nil(T, 2);   /* argument 2 is now at least nil */
'''
see_also = ["tea_check_any", "tea_push_nil", "tea_is_nonenil"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the argument"

