[[entry]]
name = "tea_opt_integer"
kind = "function"
since = "1.0"
tags = ["opt", "integer"]
signature = "tea_Integer tea_opt_integer(tea_State* T, int index, tea_Integer def);"
summary = "Optional integer"
description = "Returns the number at `index` truncated to a `tea_Integer`, or `def` if the argument is absent."
returns = "The integer at `index`, or `def`."
errors = "Raises a type error if the argument is present but is not a number."
stack = "[-0, +0, v]"
example = '''
static void repeat(tea_State* T)
{
    const char* s = tea_check_string(T, 1);
    tea_Integer n = tea_opt_integer(T, 2, 1);   /* once by default */
    for(tea_Integer i = 0; i < n; i++)
        tea_push_string(T, s);
    tea_concat(T, (int)n);
}
'''
see_also = ["tea_check_integer", "tea_opt_number"]

