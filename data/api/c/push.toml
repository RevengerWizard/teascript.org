[[entry]]
name = "tea_push_literal"
kind = "macro"
since = "1.0"
tags = ["push", "string", "macro"]
signature = '#define tea_push_literal(T, s) tea_push_lstring(T, "" s, (sizeof(s)/sizeof(char))-1)'
summary = "Push string literal"
description = "Pushes a C string literal onto the stack. The length is computed at compile time, so no `strlen` is needed. It only works with literals (the `\"\" s` trick makes the compiler reject anything else)."
returns = "A pointer to the internal copy of the string."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
tea_push_literal(T, "hello");
'''
see_also = ["tea_push_lstring", "tea_push_string"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "s"
desc = "String literal"

