[[entry]]
name = "tea_push_fstring"
kind = "function"
since = "1.0"
tags = ["push", "string"]
signature = "const char* tea_push_fstring(tea_State* T, const char* fmt, ...);"
summary = "Push formatted string"
description = "Pushes a string built from a `printf`-style format string and the following arguments. Only a limited subset of `printf` specifiers is supported. Equivalent to calling `tea_push_vfstring` with a `va_list` of the arguments."
returns = "A pointer to the internal copy of the string."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
tea_push_fstring(T, "Hello, %s! You have %d messages.", "Alice", 5);
/* ["Hello, Alice! You have 5 messages."] */
'''
see_also = ["tea_push_vfstring", "tea_push_string", "tea_error"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "fmt"
desc = "Format string (limited `printf`-like syntax)"

[[entry.params]]
name = "..."
desc = "Arguments for the format specifiers"

###

[[entry]]
name = "tea_push_vfstring"
kind = "function"
since = "1.0"
tags = ["push", "string"]
signature = "const char* tea_push_vfstring(tea_State* T, const char* fmt, va_list args);"
summary = "Push formatted string (va_list)"
description = "Same as `tea_push_fstring`, but takes its arguments as a `va_list`. Use it to build your own variadic formatting functions."
returns = "A pointer to the internal copy of the string."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
static void push_log(tea_State* T, const char* fmt, ...)
{
    va_list args;
    va_start(args, fmt);
    tea_push_vfstring(T, fmt, args);
    va_end(args);
}
'''
see_also = ["tea_push_fstring"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "fmt"
desc = "Format string (limited `printf`-like syntax)"

[[entry.params]]
name = "args"
desc = "`va_list` with the arguments"

