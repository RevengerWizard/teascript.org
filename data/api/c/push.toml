title = "Push Functions"
slug = "push"
summary = "Push C values onto the stack"
description = "Functions that push a C value onto the stack, converting it into a Teascript value. Each pushes exactly one value. The ones that create objects (strings, ranges, closures) may need to allocate memory, and can raise a memory error."

[[entry]]
name = "tea_push_nil"
kind = "function"
since = "1.0"
tags = ["push", "nil"]
signature = "void tea_push_nil(tea_State* T);"
summary = "Push nil"
description = "Pushes `nil` onto the stack."
stack = "[-0, +1, -]"
example = '''
tea_push_nil(T);   /* [nil] */
'''
see_also = ["tea_push_bool", "tea_is_nil"]

[[entry.params]]
name = "T"
desc = "Teascript state"

