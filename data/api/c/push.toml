[[entry]]
name = "tea_push_pointer"
kind = "function"
since = "1.0"
tags = ["push", "pointer"]
signature = "void tea_push_pointer(tea_State* T, void* p);"
summary = "Push C pointer"
description = "Pushes a raw C pointer onto the stack. The garbage collector does not manage it: the memory it points to must be kept alive by the caller. To tie memory to the lifetime of a Teascript value, use a userdata instead."
stack = "[-0, +1, -]"
example = '''
int data = 42;
tea_push_pointer(T, &data);   /* [pointer] */
'''
see_also = ["tea_get_pointer", "tea_new_userdata"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "p"
desc = "Pointer to push"

