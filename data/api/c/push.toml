[[entry]]
name = "tea_push_range"
kind = "function"
since = "1.0"
tags = ["push", "range"]
signature = "void tea_push_range(tea_State* T, tea_Number start, tea_Number end, tea_Number step);"
summary = "Push range"
description = "Pushes a range onto the stack. A range is a numeric sequence defined by a `start`, an `end` and a `step` increment."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
tea_push_range(T, 1, 10, 2);    /* 1 to 10, step 2 */
tea_push_range(T, 0, 1, 0.1);   /* 0 to 1, step 0.1 */
'''
see_also = ["tea_get_range", "tea_check_range"]

