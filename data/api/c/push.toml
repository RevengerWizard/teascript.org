[[entry]]
name = "tea_push_lstring"
kind = "function"
since = "1.0"
tags = ["push", "string"]
signature = "const char* tea_push_lstring(tea_State* T, const char* s, size_t len);"
summary = "Push string with length"
description = "Pushes the string made of the `len` bytes at `s` onto the stack. The bytes are copied, so `s` need not stay valid. Unlike `tea_push_string`, the string may contain embedded zero bytes."
returns = "A pointer to the internal copy of the string."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
tea_push_lstring(T, "foo\0bar", 7);   /* ["foo\0bar"] */
'''
see_also = ["tea_push_string", "tea_push_fstring", "tea_push_literal"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "s"
desc = "Pointer to the string data"

[[entry.params]]
name = "len"
desc = "Length of the string in bytes"

###

[[entry]]
name = "tea_push_string"
kind = "function"
since = "1.0"
tags = ["push", "string"]
signature = "const char* tea_push_string(tea_State* T, const char* s);"
summary = "Push C string"
description = "Pushes the NUL-terminated C string `s` onto the stack. The length is found with `strlen`, and the bytes are copied.\n\nUse `tea_push_lstring` if the string may contain embedded zero bytes."
returns = "A pointer to the internal copy of the string."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
tea_push_string(T, "foo");       /* ["foo"] */
tea_push_string(T, "foo\0bar");  /* ["foo", "foo"]: stops at the first zero */
tea_push_string(T, "");          /* ["foo", "foo", ""] */
'''
see_also = ["tea_push_lstring", "tea_push_fstring", "tea_push_literal"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "s"
desc = "NUL-terminated string"

