[[entry]]
name = "tea_push_cclosure"
kind = "function"
since = "1.0"
tags = ["push", "cfunction"]
signature = "void tea_push_cclosure(tea_State* T, tea_CFunction fn, int nupvalues, int nargs, int nopts);"
summary = "Push C closure"
description = "Pushes a new C closure onto the stack: a C function together with a set of upvalues. The top `nupvalues` values of the stack are popped and stored as the closure's upvalues, which the function reads with `tea_upvalue_index`.\n\n`nargs` is the number of required arguments and `nopts` the number of optional ones. Use `TEA_VARG` for a variadic function."
errors = "May raise a memory error."
stack = "[-nupvalues, +1, m]"
example = '''
tea_push_integer(T, 100);   /* upvalue 1 */
tea_push_integer(T, 200);   /* upvalue 2 */
tea_push_cclosure(T, my_func, 2, 1, 0);
/* [cclosure] holding the upvalues 100 and 200 */
'''
see_also = ["tea_push_cfunction", "tea_upvalue_index", "tea_set_funcs"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "fn"
desc = "C function called when the closure is invoked"

[[entry.params]]
name = "nupvalues"
desc = "Number of values to pop from the stack as upvalues"

[[entry.params]]
name = "nargs"
desc = "Number of required arguments, or `TEA_VARG`"

[[entry.params]]
name = "nopts"
desc = "Number of optional arguments"

###

[[entry]]
name = "tea_push_cfunction"
kind = "function"
since = "1.0"
tags = ["push", "cfunction"]
signature = "void tea_push_cfunction(tea_State* T, tea_CFunction fn, int nargs, int nopts);"
summary = "Push C function"
description = "Pushes a C function onto the stack. Equivalent to `tea_push_cclosure` with no upvalues.\n\n`nargs` is the number of required arguments and `nopts` the number of optional ones. Use `TEA_VARG` for a variadic function."
errors = "May raise a memory error."
stack = "[-0, +1, m]"
example = '''
tea_push_cfunction(T, my_func, 2, 1);   /* two required arguments, one optional */
tea_set_global(T, "my_func");
'''
see_also = ["tea_push_cclosure", "tea_set_funcs", "tea_is_cfunction"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "fn"
desc = "C function to push"

[[entry.params]]
name = "nargs"
desc = "Number of required arguments, or `TEA_VARG`"

[[entry.params]]
name = "nopts"
desc = "Number of optional arguments"
