[[entry]]
name = "tea_get_range"
kind = "function"
since = "1.0"
tags = ["get", "range"]
signature = "void tea_get_range(tea_State* T, int index, tea_Number* start, tea_Number* end, tea_Number* step);"
summary = "Get range parts"
description = "Retrieves the components of the range at `index`. The value must be a range. Any of the output pointers may be `NULL`, in which case that component is not written."
errors = "Raises an internal API error if the value is not a range."
stack = "[-0, +0, e]"
example = '''
tea_push_range(T, 0, 10, 2);
tea_Number start, end, step;
tea_get_range(T, -1, &start, &end, &step);   /* 0, 10, 2 */
'''
see_also = ["tea_check_range", "tea_push_range", "tea_is_range"]

