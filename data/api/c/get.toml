title = "Get Functions"
slug = "get"
summary = "Strict stack-to-C accessors"
description = "Functions that read a value from the stack as a C value, when you already know its type. Unlike the `tea_to_*` functions, they do not convert, and unlike the `tea_check_*` functions, they do not produce friendly argument errors: using one on a value of the wrong type is a programming error and raises an internal API error. Test the type first with `tea_get_type` or the `tea_is_*` macros, or use the check functions to validate arguments."

[[entry]]
name = "tea_get_bool"
kind = "function"
since = "1.0"
tags = ["get", "bool"]
signature = "bool tea_get_bool(tea_State* T, int index);"
summary = "Get boolean"
description = "Returns the boolean value at `index`. The value must be a boolean. To apply Teascript truthiness rules to any value, use `tea_to_bool`."
returns = "The boolean value at `index`."
errors = "Raises an internal API error if the value is not a boolean."
stack = "[-0, +0, e]"
example = '''
tea_push_true(T);
if(tea_get_bool(T, -1))
    printf("value is true\n");
'''
see_also = ["tea_to_bool", "tea_check_bool", "tea_is_bool"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value"

