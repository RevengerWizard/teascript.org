[[entry]]
name = "tea_get_pointer"
kind = "function"
since = "1.0"
tags = ["get", "pointer"]
signature = "const void* tea_get_pointer(tea_State* T, int index);"
summary = "Get pointer"
description = "Returns the raw C pointer at `index`. The value must be a pointer (see `tea_push_pointer`), not a userdata."
returns = "The pointer stored at `index`."
errors = "Raises an internal API error if the value is not a pointer."
stack = "[-0, +0, e]"
example = '''
void* handle = get_some_handle();
tea_push_pointer(T, handle);
const void* ptr = tea_get_pointer(T, -1);
printf("my pointer is %p\n", ptr);
'''
see_also = ["tea_to_pointer", "tea_check_pointer", "tea_push_pointer"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the value"

