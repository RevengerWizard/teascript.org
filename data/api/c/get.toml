[[entry]]
name = "tea_get_string"
kind = "function"
since = "1.0"
tags = ["get", "string"]
signature = "const char* tea_get_string(tea_State* T, int index);"
summary = "Get string"
description = "Returns the string at `index` as a C string. The value must be a string. Equivalent to `tea_get_lstring(T, index, NULL)`.\n\nBecause strings may contain embedded zero bytes, use `tea_get_lstring` when you need the real length."
returns = "A pointer to the string data."
errors = "Raises an internal API error if the value is not a string."
stack = "[-0, +0, e]"
example = '''
tea_push_string(T, "tea");
const char* name = tea_get_string(T, -1);   /* "tea" */
'''
see_also = ["tea_get_lstring", "tea_to_string", "tea_check_string"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the string"

