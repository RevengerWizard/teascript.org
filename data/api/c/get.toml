[[entry]]
name = "tea_get_udvalue"
kind = "function"
since = "1.0"
tags = ["get", "userdata"]
signature = "bool tea_get_udvalue(tea_State* T, int ud, int n);"
summary = "Get userdata uservalue"
description = "Pushes the `n`-th user value of the userdata at `ud`, as created with `tea_new_userdatav` or `tea_new_udatav`. User values start out as `nil` and are set with `tea_set_udvalue`.\n\nReturns `true` if the user value exists and was pushed; returns `false` and pushes nothing if `n` is out of range."
returns = "`true` if the value was pushed; `false` otherwise."
stack = "[-0, +1, -]"
example = '''
tea_new_userdatav(T, sizeof(int), 2);   /* two user values */
tea_push_string(T, "tag");
tea_set_udvalue(T, -2, 0);              /* user value 0 = "tag" */

if(tea_get_udvalue(T, -1, 0))
    printf("%s\n", tea_get_string(T, -1));   /* tag */
tea_pop(T, 1);
'''
see_also = ["tea_set_udvalue", "tea_new_userdatav", "tea_new_udatav"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "ud"
desc = "Stack index of the userdata"

[[entry.params]]
name = "n"
desc = "Zero-based number of the user value"
