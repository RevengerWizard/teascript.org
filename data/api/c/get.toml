[[entry]]
name = "tea_get_number"
kind = "function"
since = "1.0"
tags = ["get", "number"]
signature = "tea_Number tea_get_number(tea_State* T, int index);"
summary = "Get number"
description = "Returns the number at `index` as a `tea_Number` (a `double`). The value must be a number."
