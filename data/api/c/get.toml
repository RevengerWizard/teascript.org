[[entry]]
name = "tea_get_lstring"
kind = "function"
since = "1.0"
tags = ["get", "string"]
signature = "const char* tea_get_lstring(tea_State* T, int index, size_t* len);"
summary = "Get string and length"
description = "Returns the string at `index` as a C string. The value must be a string. The pointer refers to the interpreter's internal copy and stays valid as long as the string remains on the stack.\n\nIf `len` is not `NULL`, the string length is stored in `*len`. Teascript strings may contain embedded zero bytes, so use the length rather than relying on the terminator.\n\n> [!NOTE]\n> The result is never `NULL`, even for an empty string."
returns = "A pointer to the string data."
errors = "Raises an internal API error if the value is not a string."
stack = "[-0, +0, e]"
example = '''
tea_push_lstring(T, "hello\0world", 11);
size_t len;
const char* s = tea_get_lstring(T, -1, &len);   /* len = 11 */
printf("%.*s\n", (int)len, s);
'''
see_also = ["tea_get_string", "tea_to_lstring", "tea_check_lstring"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the string"

[[entry.params]]
name = "len"
desc = "Receives the string length, or `NULL`"

