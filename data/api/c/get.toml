[[entry]]
name = "tea_get_integer"
kind = "function"
since = "1.0"
tags = ["get", "integer"]
signature = "tea_Integer tea_get_integer(tea_State* T, int index);"
summary = "Get integer"
description = "Returns the number at `index` converted to a `tea_Integer`. The value must be a number; the fractional part is discarded (truncation toward zero)."
returns = "The number at `index`, truncated to a `tea_Integer`."
errors = "Raises an internal API error if the value is not a number."
stack = "[-0, +0, e]"
example = '''
tea_push_number(T, 42.9);
tea_Integer n = tea_get_integer(T, -1);   /* n = 42 */
printf("int value %td\n", n);
'''
see_also = ["tea_get_number", "tea_to_integer", "tea_check_integer"]

