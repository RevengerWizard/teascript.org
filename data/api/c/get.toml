[[entry]]
name = "tea_get_userdata"
kind = "function"
since = "1.0"
tags = ["get", "userdata"]
signature = "void* tea_get_userdata(tea_State* T, int index);"
summary = "Get userdata block"
description = "Returns a pointer to the data block of the userdata at `index`. The value must be a userdata. Unlike `tea_check_udata`, this does not verify the userdata's class."
returns = "A pointer to the userdata's data block."
errors = "Raises an internal API error if the value is not a userdata."
stack = "[-0, +0, e]"
example = '''
MyBuffer* buf = (MyBuffer*)tea_new_userdata(T, sizeof(MyBuffer));
/* ... */
MyBuffer* same = (MyBuffer*)tea_get_userdata(T, -1);   /* same == buf */
'''
see_also = ["tea_to_userdata", "tea_check_userdata", "tea_test_udata", "tea_new_userdata"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the userdata"

