signature = "const char* tea_check_lstring(tea_State* T, int index, size_t* len);"
summary = "Check string and length"
description = "Checks that the value at `index` is a string and returns a pointer to its data. If `len` is not `NULL`, the string length is stored in `*len`. Use the length: Teascript strings may contain embedded zero bytes.\n\nThe pointer is valid as long as the string stays on the stack."
returns = "A pointer to the string data."
errors = "Raises a type error if the value is not a string."
stack = "[-0, +0, v]"
example = '''
size_t len;
const char* data = tea_check_lstring(T, 1, &len);
'''
see_also = ["tea_check_string", "tea_opt_lstring", "tea_get_lstring"]

