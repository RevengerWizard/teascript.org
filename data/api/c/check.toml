[[entry]]
name = "tea_check_option"
kind = "function"
since = "1.0"
tags = ["check", "string"]
signature = "int tea_check_option(tea_State* T, int index, const char* def, const char* const options[]);"
summary = "Check enum option"
description = "Checks that the value at `index` is a string equal to one of the strings in `options`, which must be terminated by `NULL`, and returns its position in the array. If the argument is absent and `def` is not `NULL`, `def` is used in its place.\n\nIt is the usual way to map a string argument to a C enum."
returns = "The index in `options` of the selected string."
errors = "Raises an argument error if the value is not a string, or is not one of the options."
stack = "[-0, +0, v]"
example = '''
static const char* const modes[] = { "read", "write", "append", NULL };

static void open_file(tea_State* T)
{
    const char* path = tea_check_string(T, 1);
    int mode = tea_check_option(T, 2, "read", modes);   /* 0, 1 or 2 */
    /* ... */
}
'''
see_also = ["tea_check_string", "tea_opt_string"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the argument"

[[entry.params]]
name = "def"
desc = "Default option used when the argument is absent, or `NULL` for none"

[[entry.params]]
name = "options"
desc = "`NULL`-terminated array of accepted strings"

