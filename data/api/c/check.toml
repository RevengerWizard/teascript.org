title = "Argument Checking"
slug = "check"
summary = "Validate C function arguments"
description = "Functions for validating the arguments received by a C function. Each `tea_check_*` function verifies the value at `index` and returns it as a C value; if the check fails, a bad argument error that names the offending argument is raised, so a C function can validate all its arguments at the top and then work with plain C values.\n\nThese functions raise errors and never return on failure. For a non-raising test, use the `tea_is_*` macros or `tea_test_udata`; for arguments that may be absent, see the Optional Arguments section; for values you already know have the right type, see the Get Functions section."

[[entry]]
name = "tea_check_type"
kind = "function"
since = "1.0"
tags = ["check", "type"]
signature = "void tea_check_type(tea_State* T, int index, int type);"
summary = "Check exact type"
description = "Checks that the value at `index` has exactly the type `type`, one of the `TEA_TYPE_*` constants."
errors = "Raises a type error if the value does not have the expected type."
stack = "[-0, +0, v]"
example = '''
/* argument 1 must be a list */
tea_check_type(T, 1, TEA_TYPE_LIST);
'''
see_also = ["tea_check_any", "tea_get_type", "tea_is_mask"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "index"
desc = "Stack index of the argument"

[[entry.params]]
name = "type"
desc = "Expected type (`TEA_TYPE_*`)"

