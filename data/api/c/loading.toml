[[entry]]
name = "tea_loadx"
kind = "function"
since = "1.0"
tags = ["load"]
signature = "int tea_loadx(tea_State* T, tea_Reader reader, void* data, const char* name, const char* mode);"
summary = "Load chunk with mode"
description = "Loads a chunk using the reader function `reader`, which is called repeatedly to supply successive pieces of it. `data` is passed through to the reader.\n\n`name` is the chunk's name, used in error messages and as the module environment name. `mode` controls what is accepted: `\"t\"` for text source, `\"b\"` for binary bytecode, and `\"bt\"` for both. `NULL` is the same as `\"bt\"`.\n\nOn success the compiled chunk is pushed as a function, ready to be called. On failure an error code is returned and the error message is pushed instead."
returns = "`TEA_OK` on success; otherwise an error code."
stack = "[-0, +1, v]"
example = '''
Source src = { "return 1 + 2", 0 };   /* Source and string_reader: see tea_Reader */

if(tea_loadx(T, string_reader, &src, "=inline", "t") == TEA_OK)
{
    tea_pcall(T, 0);                   /* run it: the result replaces the function */
    printf("%g\n", tea_get_number(T, -1));   /* 3 */
    tea_pop(T, 1);
}
'''
see_also = ["tea_load", "tea_dump", "tea_load_bufferx", "tea_load_filex"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "reader"
desc = "Callback that returns the next piece of the chunk"

[[entry.params]]
name = "data"
desc = "User data passed to `reader`"

[[entry.params]]
name = "name"
desc = "Chunk name, used in error messages and as the module environment name"

[[entry.params]]
name = "mode"
desc = "Accepted input: `\"t\"`, `\"b\"`, `\"bt\"` or `NULL`"

