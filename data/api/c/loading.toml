[[entry]]
name = "tea_Writer"
kind = "typedef"
since = "1.0"
tags = ["load", "typedef"]
signature = "typedef int (*tea_Writer)(tea_State* T, void* ud, const void* p, size_t sz);"
summary = "Chunk writer callback"
description = "Type of the function that `tea_dump` calls with each successive piece of the serialized chunk. `p` points to `sz` bytes. Return `0` to continue; any other value stops the dump and is returned by `tea_dump`."
example = '''
static int file_writer(tea_State* T, void* ud, const void* p, size_t sz)
{
    (void)T;
    return fwrite(p, 1, sz, (FILE*)ud) == sz ? 0 : 1;
}
'''
see_also = ["tea_dump"]

