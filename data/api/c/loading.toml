[[entry]]
name = "tea_dump"
kind = "function"
since = "1.0"
tags = ["load"]
signature = "int tea_dump(tea_State* T, tea_Writer writer, void* data);"
summary = "Serialize function"
description = "Serializes the function on top of the stack into bytecode, calling `writer` with successive pieces of the output. `data` is passed through to the writer. The function is not popped.\n\nThis is the counterpart of `tea_loadx`: use it to precompile chunks or to save compiled code. The output starts with `TEA_SIGNATURE`."
returns = "`TEA_OK` on success; otherwise the non-zero value returned by the writer."
stack = "[-0, +0, v]"
example = '''
/* a compiled function is on top of the stack; file_writer: see tea_Writer */
FILE* fp = fopen("out.tbc", "wb");
int status = tea_dump(T, file_writer, fp);
fclose(fp);
tea_pop(T, 1);
'''
see_also = ["tea_Writer", "tea_loadx", "TEA_SIGNATURE"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "writer"
desc = "Callback invoked with each piece of output"

[[entry.params]]
name = "data"
desc = "User data passed to `writer`"

