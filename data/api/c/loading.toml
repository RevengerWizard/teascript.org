[[entry]]
name = "tea_load"
kind = "function"
since = "1.0"
tags = ["load"]
signature = "int tea_load(tea_State* T, tea_Reader reader, void* data, const char* name);"
summary = "Load chunk"
description = "Equivalent to `tea_loadx` with `mode` set to `NULL`, accepting both text and binary chunks."
returns = "`TEA_OK` on success; otherwise an error code."
stack = "[-0, +1, v]"
example = '''
Source src = { "return 'hello'", 0 };   /* Source and string_reader: see tea_Reader */

if(tea_load(T, string_reader, &src, "=greeting") == TEA_OK
   && tea_pcall(T, 0) == TEA_OK)
{
    printf("%s\n", tea_get_string(T, -1));
}
tea_pop(T, 1);   /* the result, or the error message */
'''
see_also = ["tea_loadx", "tea_load_buffer"]

