title = "Code Loading"
slug = "loading"
summary = "Load, dump and import code"
description = "Functions for loading Teascript source or precompiled bytecode, serializing compiled functions, evaluating strings and importing modules. Loading never runs the code: a successful load pushes the compiled chunk as a function, which you then run with `tea_call` or `tea_pcall`. Each loader comes in two forms: the `x` variant takes a `mode` argument selecting text or binary input, and the plain variant accepts both.\n\nCalling a loaded chunk is covered in the Calls section."

[[entry]]
name = "TEA_SIGNATURE"
kind = "const"
since = "1.0"
tags = ["load", "string", "const"]
signature = '#define TEA_SIGNATURE "\x1bTea"'
summary = "Bytecode signature"
description = "The bytes (`<esc>Tea`) that start every precompiled chunk produced by `tea_dump`. The loaders use it to tell binary chunks from source text."
see_also = ["tea_dump", "tea_loadx"]

###

[[entry]]
name = "tea_Reader"
kind = "typedef"
since = "1.0"
tags = ["load", "typedef"]
signature = "typedef const char* (*tea_Reader)(tea_State* T, void* ud, size_t* sz);"
summary = "Chunk reader callback"
description = "Type of the function that `tea_load` and `tea_loadx` call repeatedly to get successive pieces of a chunk. Each call returns a pointer to the next piece and stores its size in `*sz`. To signal the end of the chunk, return `NULL` and set `*sz` to `0`.\n\nThe returned piece must stay valid until the next call to the reader."
example = '''
typedef struct Source
{
    const char* text;
    int done;
} Source;

static const char* string_reader(tea_State* T, void* ud, size_t* sz)
{
    Source* s = (Source*)ud;
    (void)T;
    if(s->done)
    {
        *sz = 0;
        return NULL;
    }
    s->done = 1;
    *sz = strlen(s->text);
    return s->text;
}
'''
see_also = ["tea_load", "tea_loadx"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "ud"
desc = "User data given to the loader"

[[entry.params]]
name = "sz"
desc = "Receives the size of the returned piece"

