[[entry]]
name = "tea_load_bufferx"
kind = "function"
since = "1.0"
tags = ["load"]
signature = "int tea_load_bufferx(tea_State* T, const char* buffer, size_t size, const char* name, const char* mode);"
summary = "Load buffer with mode"
description = "Loads a chunk directly from the in-memory buffer `buffer` of `size` bytes. `name` and `mode` behave as in `tea_loadx`. The buffer may contain embedded NUL bytes."
returns = "`TEA_OK` on success; otherwise an error code."
stack = "[-0, +1, v]"
example = '''
const char* src = "return 6 * 7";
if(tea_load_bufferx(T, src, strlen(src), "=answer", "t") == TEA_OK
   && tea_pcall(T, 0) == TEA_OK)
{
    printf("%d\n", (int)tea_get_integer(T, -1));   /* 42 */
}
tea_pop(T, 1);
'''
see_also = ["tea_load_buffer", "tea_loadx", "tea_eval"]

