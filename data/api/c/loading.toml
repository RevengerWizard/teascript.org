[[entry]]
name = "tea_eval"
kind = "function"
since = "1.0"
tags = ["load", "call"]
signature = "int tea_eval(tea_State* T, const char* s);"
summary = "Evaluate string"
description = "Loads the NUL-terminated string `s`, runs it, and leaves the result on the stack. On failure an error code is returned and the error value is left on the stack instead.\n\n> [!NOTE]\n> Unlike `tea_load_buffer`, the source is a C string and cannot contain embedded NUL bytes."
returns = "`TEA_OK` on success; otherwise an error code."
stack = "[-0, +?, e]"
example = '''
if(tea_eval(T, "1 + 2 * 3") == TEA_OK)
{
    printf("%g\n", tea_get_number(T, -1));   /* 7 */
}
tea_pop(T, 1);   /* the result, or the error value */
'''
see_also = ["tea_load_buffer", "tea_pcall"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "s"
desc = "Source code to evaluate"

###

[[entry]]
name = "tea_import"
kind = "function"
since = "1.0"
tags = ["load", "module"]
signature = "void tea_import(tea_State* T, const char* name);"
summary = "Import module"
description = "Imports the module with the logical name `name`, loading and running it first if it has not been loaded yet, and pushes the module onto the stack. This is the C counterpart of the `import` statement in Teascript."
stack = "[-0, +1, e]"
example = '''
tea_import(T, "math");
if(tea_get_key(T, -1, "sqrt"))
{
    tea_push_number(T, 16.0);
    tea_call(T, 1);
    printf("%g\n", tea_get_number(T, -1));   /* 4 */
    tea_pop(T, 1);   /* the result */
}
tea_pop(T, 1);       /* the module */
'''
see_also = ["tea_get_var", "tea_get_global"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "name"
desc = "Logical name of the module"

###

[[entry]]
name = "tea_do_file"
kind = "macro"
since = "1.0"
tags = ["load", "call", "macro"]
signature = "#define tea_do_file(T, fn) (tea_load_file(T, fn, NULL) || tea_pcall(T, 0))"
summary = "Load and run file"
description = "Loads the file `fn` and runs it in protected mode. Leaves exactly one value on the stack: the chunk's result on success, or the error value on failure."
returns = "`TEA_OK` on success; otherwise an error code."
stack = "[-0, +1, -]"
example = '''
if(tea_do_file(T, "script.tea") != TEA_OK)
    fprintf(stderr, "%s\n", tea_get_string(T, -1));
tea_pop(T, 1);
'''
see_also = ["tea_load_file", "tea_pcall"]

[[entry.params]]
name = "T"
desc = "Teascript state"

[[entry.params]]
name = "fn"
desc = "Path of the file to run"
