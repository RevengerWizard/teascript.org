[[entry]]
name = "utf8.reverse"
kind = "function"
signature = "function utf8.reverse(str)"
summary = "utf8.reverse()"
description = "The function `reverse` provides a string with its UTF-8 characters in reverse order."
returns = "The reversed string"
example = '''
import utf8

// Basic usage
print(utf8.reverse("hello"))      // olleh
print(utf8.reverse("abc"))        // cba

// Works correctly with multibyte characters
print(utf8.reverse("café"))       // éfac
print(utf8.reverse("こんにちは"))  // はちにんこ

// Reverse an emoji string
print(utf8.reverse("😀😁😂"))      // 😂😁😀

// Practical example: check for palindromes
var word = "level"
if word == utf8.reverse(word)
{
    print(word + " is a palindrome")
}
else
{
    print(word + " is not a palindrome")
}
'''

[[entry.params]]
name = "str"
desc = "A string."

