[[entry]]
name = "utf8.iter"
kind = "function"
signature = "function utf8.iter(str)"
summary = "utf8.iter()"
description = "The function `iter` provides an iterator over the UTF-8 characters of a string."
returns = "An iterator function"
example = '''
import utf8

// Basic usage
for const c in utf8.iter("hello")
{
    print(c)
}
// h
// e
// l
// l
// o

// Iterate over multibyte characters
for const c in utf8.iter("café")
{
    print(c + " -> " + utf8.ord(c))
}
// c -> 99
// a -> 97
// f -> 102
// é -> 233

// Count characters manually
var count = 0
for const c in utf8.iter("こんにちは")
{
    count += 1
}
print("Character count:", count)  // 5

// Process each character with its index
var index = 0
for const c in utf8.iter("tea")
{
    print("[" + index + "] " + c)
    index += 1
}
'''

[[entry.params]]
name = "str"
desc = "A string."
