title = "UTF-8"
slug = "utf8"
kind = "module"
origin = "modules"
since = "1.0"
summary = "Unicode UTF-8 manipulation"
description = "The utf8 module provides operations for working with UTF-8 text, including counting characters, converting between characters and code points, reversing strings, and iterating through encoded text."

[[entry]]
name = "utf8.len"
kind = "function"
signature = "function utf8.len(str)"
summary = "utf8.len()"
description = "The function `len` provides the number of UTF-8 characters in a string."
returns = "The number of characters"
example = '''
import utf8

// Basic usage
print(utf8.len("hello"))      // 5
print(utf8.len("héllo"))      // 5
print(utf8.len("こんにちは"))  // 5

// Compare with byte length
var text = "café"
print("Characters: " + utf8.len(text))  // Characters: 4

// Validate user input length
var username = "José"
if utf8.len(username) < 3
{
    print("Username too short")
}
else
{
    print("Username accepted")
}
'''

[[entry.params]]
name = "str"
desc = "A string"

###

[[entry]]
name = "utf8.char"
kind = "function"
signature = "function utf8.char(n)"
summary = "utf8.char()"
description = "The function `char` provides the UTF-8 string corresponding to a Unicode code point."
returns = "The UTF-8 encoded character"
example = '''
import utf8

// Basic usage
print(utf8.char(65))       // A
print(utf8.char(233))      // é
print(utf8.char(12354))    // あ
print(utf8.char(128512))   // 😀

// Build a string from code points
var message = ""
var codes = [72, 101, 108, 108, 111]
for const c in codes
{
    message += utf8.char(c)
}
print(message)  // Hello

// Generate an emoji
print(utf8.char(0x1F600))  // 😀
'''

[[entry.params]]
name = "n"
desc = "A unicode code point as an integer"

###

[[entry]]
name = "utf8.ord"
kind = "function"
signature = "function utf8.ord(c)"
summary = "utf8.ord()"
description = "The function `ord` provides the Unicode code point of the first character in a string."
returns = "The Unicode code point as an integer"
example = '''
import utf8

// Basic usage
print(utf8.ord("A"))     // 65
print(utf8.ord("é"))     // 233
print(utf8.ord("あ"))    // 12354
print(utf8.ord("😀"))    // 128512

// Round-trip conversion
var original = "ñ"
var code = utf8.ord(original)
print(utf8.char(code))   // ñ

// Inspect the first character of a string
var word = "tea"
print("First code point: " + utf8.ord(word))  // First code point: 116
'''

[[entry.params]]
name = "c"
desc = "A string containing a single UTF-8 character."

