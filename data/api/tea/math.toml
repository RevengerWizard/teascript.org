[[entry]]
name = "math.pi"
kind = "attribute"
signature = "math.pi = 3.14159265358979323846"
summary = "The mathematical constant π (pi)"
description = "The mathematical constant π (pi), the ratio of a circle's circumference to its diameter."
example = "import math\n\n// Calculate the area of a circle with radius 5\nvar radius = 5\nvar area = math.pi * radius * radius\nprint(\"Area of circle:\", area)  // Area of circle: 78.53981633974483\n\n// Convert 180 degrees to radians\nvar radians = 180 * (math.pi / 180)\nprint(\"180 degrees in radians:\", radians)  // 180 degrees in radians: 3.141592653589793"

