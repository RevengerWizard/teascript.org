example = "import math\n\n// Basic usage\nprint(math.sign(42))    // 1\nprint(math.sign(-42))   // -1\nprint(math.sign(0))     // 0\n\n// Practical example: determine direction\nvar velocity = -15\nvar direction = math.sign(velocity)\nif direction < 0\n{\n    print(\"Moving left\")\n}\nelse if direction > 0\n{\n    print(\"Moving right\")\n}\nelse\n{\n    print(\"Stationary\")\n}\n\n// Compare two values\nvar a = 10\nvar b = 20\nvar comparison = math.sign(a - b)\nprint(\"Comparison:\", comparison)  // -1 (a < b)"

[[entry.params]]
name = "x"
desc = "A number"

