signature = "function math.exp(x)"
summary = "e raised to the power of x"
description = "The function `exp` provides e raised to the power of a number."
returns = "e^x"
example = "import math\n\n// Basic usage\nprint(math.exp(0))     // 1\nprint(math.exp(1))     // 2.718281828459045\nprint(math.exp(2))     // 7.38905609893065\n\n// Practical example: exponential growth\nvar initial = 100\nvar rate = 0.05\nfor const year in 1..11\n{\n    var value = initial * math.exp(rate * year)\n    print(\"Year \" + year + \": $\" + math.round(value * 100) / 100)\n}\n\n// Radioactive decay\nvar half_life = 5.0\nvar time = 10.0\nvar remaining = math.exp(-0.693 * time / half_life)\nprint(\"Remaining fraction:\", remaining)  // 0.25 (approximately)"

