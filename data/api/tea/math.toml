name = "math.atan2"
kind = "function"
signature = "function math.atan2(y, x)"
summary = "Arc tangent of two coordinates in radians"
description = "The function `atan2` provides the arc tangent of of two numbers representing the coordinates in radians, using the signs of both arguments to determine the correct quadrant."
returns = "The angle in radians, in the range `[-π, π]`"
example = "import math\n\n// Basic usage\nprint(math.atan2(1, 1))    // 0.7853981633974483 (π/4)\nprint(math.atan2(1, -1))   // 2.356194490192345 (3π/4)\nprint(math.atan2(-1, -1))  // -2.356194490192345 (-3π/4)\n\n// Practical example: calculate direction to target\nvar player_x = 5\nvar player_y = 5\nvar target_x = 10\nvar target_y = 8\n\nvar dx = target_x - player_x\nvar dy = target_y - player_y\nvar angle = math.atan2(dy, dx)\nprint(\"Direction to target:\", math.deg(angle), \"degrees\")  // 30.96375653207352 degrees\n\n// Convert Cartesian to polar coordinates\nvar x = 3\nvar y = 4\nvar r = math.sqrt(x * x + y * y)\nvar theta = math.atan2(y, x)\nprint(\"Polar coordinates: r=\" + r + \", theta=\" + math.deg(theta) + \"°\")"

