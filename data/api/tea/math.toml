[[entry]]
name = "math.trunc"
kind = "function"
signature = "function math.trunc(x)"
summary = "Integer part of number"
description = "The function `trunc` provides the integer part of a number by removing the fractional part."
returns = "The truncated value"
example = "import math\n\n// Basic usage\nprint(math.trunc(3.7))    // 3\nprint(math.trunc(3.2))    // 3\nprint(math.trunc(-3.7))   // -3\nprint(math.trunc(-3.2))   // -3\n\n// Difference from floor\nprint(\"floor(-3.7) = \" + math.floor(-3.7))  // -4\nprint(\"trunc(-3.7) = \" + math.trunc(-3.7))  // -3\n\n// Practical example: extract integer part\nvar price = 19.99\nvar dollars = math.trunc(price)\nvar cents = math.round((price - dollars) * 100)\nprint(\"$\" + dollars + \".\" + cents)  // $19.99"

[[entry.params]]
name = "x"
desc = "A number"

