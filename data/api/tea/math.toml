[[entry]]
name = "math.infinity"
kind = "attribute"
signature = "math.infinity"
summary = "Positive infinity."
description = "Represents positive infinity. This is a special floating-point value that is greater than any finite number."
example = "import math\n\n// Division by zero results in infinity\nvar result = 1 / 0\nprint(\"1/0 = \" + result)  // 1/0 = inf\n\n// Check if a value is infinite\nprint(\"Is infinity? \" + math.isinfinity(result))  // Is infinity? true\n\n// Infinity propagates through calculations\nprint(\"Infinity + 100 = \" + (math.infinity + 100))  // Infinity + 100 = inf\nprint(\"Infinity * 2 = \" + (math.infinity * 2))      // Infinity * 2 = inf"

