[[entry]]
name = "math.sqrt"
kind = "function"
signature = "function math.sqrt(x)"
summary = "Square root"
description = "The function `sqrt` provides the square root of a number."
returns = "The square root of `x`"
example = "import math\n\n// Basic usage\nprint(math.sqrt(16))    // 4\nprint(math.sqrt(25))    // 5\nprint(math.sqrt(2))     // 1.4142135623730951\n\n// Practical example: calculate distance between points\nvar x1 = 0\nvar y1 = 0\nvar x2 = 3\nvar y2 = 4\nvar distance = math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2)\nprint(\"Distance:\", distance)  // 5\n\n// Calculate hypotenuse\nvar a = 6\nvar b = 8\nvar c = math.sqrt(a * a + b * b)\nprint(\"Hypotenuse:\", c)  // 10\n\n// Standard deviation calculation\nvar values = [2, 4, 4, 4, 5, 5, 7, 9]\nvar mean = 5\nvar sum_sq_diff = 0\nfor const v in values\n{\n    sum_sq_diff = sum_sq_diff + (v - mean) ** 2\n}\nvar std_dev = math.sqrt(sum_sq_diff / values)\nprint(\"Standard deviation:\", std_dev)  // 2.0"

[[entry.params]]
name = "x"
desc = "A non-negative number"

