name = "math.clamp()"
kind = "function"
signature = "function math.clamp(d, min, max)"
summary = "The function clamp restricts a numeric value to a specified range."
description = "The function `clamp` restricts a numeric value to a specified range."
returns = "The clamped value"
example = "import math\n\n// Basic clamping\nprint(math.clamp(5, 1, 10))    // 5\nprint(math.clamp(-5, 1, 10))   // 1\nprint(math.clamp(15, 1, 10))   // 10\n\n// Practical example: limit player health\nvar health = 150\nvar max_health = 100\nvar min_health = 0\nhealth = math.clamp(health, min_health, max_health)\nprint(\"Health after healing:\", health)  // 100\n\n// Damage calculation with clamping\nvar current_hp = 50\nvar damage = 75\nvar new_hp = math.clamp(current_hp - damage, 0, 100)\nprint(\"HP after damage:\", new_hp)  // 0\n\n// Clamp color values to valid range\nvar red = 300\nvar green = -50\nvar blue = 128\nvar r = math.clamp(red, 0, 255)     // 255\nvar g = math.clamp(green, 0, 255)   // 0\nvar b = math.clamp(blue, 0, 255)    // 128\nprint(\"RGB: \" + r + \" \" + g + \" \" + b)  // RGB: 255 0 128"

[[entry.params]]
name = "d"
desc = "The value to clamp"

[[entry.params]]
name = "min"
desc = "The minimum allowed value"

[[entry.params]]
name = "max"
desc = "The maximum allowed value"

