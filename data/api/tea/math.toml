[[entry]]
name = "math.frexp"
kind = "function"
signature = "function math.frexp(x)"
summary = "Normalized fraction and an exponent"
description = "The function `frexp` breaks a number into a normalized fraction and an exponent."
returns = "A list `[exponent, mantissa]` such that `x = mantissa * 2^exponent`"
example = "import math\n\n// Basic usage\nvar result = math.frexp(8)\nprint(\"Exponent:\", result[0])    // 4\nprint(\"Mantissa:\", result[1])    // 0.5\n// 8 = 0.5 * 2^4\n\n// Practical example: analyze floating-point representation\nvar value = 123.456\nvar parts = math.frexp(value)\nprint(value + \" = \" + parts[1] + \" * 2^\" + parts[0])\n\n// Reconstruct the original value\nvar reconstructed = parts[1] * (2 ** parts[0])\nprint(\"Reconstructed:\", reconstructed)  // 123.456"

[[entry.params]]
name = "x"
desc = "A number"

