name = "math.isinfinity"
kind = "function"
signature = "function math.isinfinity(x)"
summary = "Check for infinity"
description = "The function `isinfinity` checks if `x` is positive or negative infinity."
returns = "`true` if `x` is infinite, `false` otherwise"
example = "import math\n\n// Basic usage\nprint(math.isinfinity(1.0))          // false\nprint(math.isinfinity(math.infinity)) // true\nprint(math.isinfinity(-math.infinity)) // true\nprint(math.isinfinity(math.nan))     // false\n\n// Practical example: check for overflow\nvar result = math.exp(1000)\nif math.isinfinity(result)\n{\n    print(\"Overflow detected!\")\n}\nelse\n{\n    print(\"Result:\", result)\n}\n\n// Safe division\nvar numerator = 10\nvar denominator = 0\nvar result = numerator / denominator\nif math.isinfinity(result)\n{\n    print(\"Cannot divide by zero\")\n}\nelse\n{\n    print(\"Result:\", result)\n}"

