title = "Debug"
slug = "debug"
kind = "module"
origin = "modules"
since = "1.0"
summary = "Internal debug informations"
description = "The debug module exposes information about functions and compiled code, including function metadata, bytecode instructions, upvalues, and source line information. It is intended for tools that inspect Teascript programs."

[[entry]]
name = "debug.funcinfo"
kind = "function"
signature = "function debug.funcinfo(proto, pc)"
summary = "Function header information"
description = "The function `funcinfo` provides information about a function prototype."
example = '''
import debug

// Inspect a function's prototype
var info = debug.funcinfo(my_function)
print("Function name:", info.name)
print("Defined from line:", info.linedefined)
print("Defined to line:", info.lastlinedefined)
print("Number of parameters:", info.params)
print("Number of optional parameters:", info.optparams)
print("Number of constants:", info.kconsts)
print("Number of upvalues:", info.upvalues)
print("Number of bytecodes:", info.bytecodes)
print("Stack slots:", info.stackslots)
print("Is vararg:", info.isvararg)
print("Has children:", info.children)

// Inspect at a specific bytecode position
var info = debug.funcinfo(my_function, 5)
print("Current line at pc 5:", info.currentline)
'''

[[entry.params]]
name = "proto"
desc = "The function prototype to inspect"

[[entry.params]]
name = "pc"
desc = "An optional bytecode position (default: 0)"

###

[[entry]]
name = "debug.funck"
kind = "function"
signature = "function debug.funck(proto, index)"
summary = "Function constants pool"
description = "The function `funck` retrieves a constant from a function prototype's constant table."
example = '''
import debug

// Get the first constant
var constant = debug.funck(my_function, 0)
print("Constant at index 0:", constant)

// Get a string constant
var name = debug.funck(my_function, 1)
print("Constant at index 1:", name)

// Iterate through all constants
var info = debug.funcinfo(my_function)
for const i in 0..info.kconsts
{
    var k = debug.funck(my_function, i)
    print("Constant " + i + ": " + tostring(k))
}
'''

[[entry.params]]
name = "proto"
desc = "The function prototype to inspect"

[[entry.params]]
name = "index"
desc = "The index of the constant to retrieve"

###

[[entry]]
name = "debug.funcbc"
kind = "function"
signature = "function debug.funcbc(proto, index)"
summary = "Function bytecodes"
description = "The function `funcbc` retrieves a bytecode instruction from a function prototype."
example = '''
import debug

// Get the first bytecode instruction
var bc = debug.funcbc(my_function, 0)
print("First bytecode:", bc)

// Inspect all bytecode instructions
var info = debug.funcinfo(my_function)
for const i in 0..info.bytecodes
{
    var bc = debug.funcbc(my_function, i)
    print("Bytecode " + i + ": " + bc)
}
'''

[[entry.params]]
name = "proto"
desc = "The function prototype to inspect"

[[entry.params]]
name = "index"
desc = "The index of the bytecode instruction to retrieve"

###

