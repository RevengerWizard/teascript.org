[[entry]]
name = "debug.funcline"
kind = "function"
signature = "function debug.funcline(proto, offset)"
summary = "Function line information"
description = "The function `funcline` provides the source line number corresponding to a bytecode offset in a function prototype."
example = '''
import debug

// Get the line number for a specific bytecode offset
var line = debug.funcline(my_function, 0)
print("Line at offset 0:", line)

// Map bytecode offsets to source lines
var info = debug.funcinfo(my_function)
for const i in 0..info.bytecodes
{
    var line = debug.funcline(my_function, i)
    print("Bytecode " + i + " is at line " + line)
}
'''

[[entry.params]]
name = "proto"
desc = "The function prototype to inspect"

[[entry.params]]
name = "offset"
desc = "The bytecode offset"
