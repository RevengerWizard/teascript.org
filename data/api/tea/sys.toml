title = "Sys"
slug = "sys"
kind = "module"
origin = "modules"
since = "1.0"
summary = "The `sys` module provides access to system-specific parameters and functions."
description = "The sys module exposes runtime and platform information, including integer size, byte order, command-line arguments, version details, and process exit."

[[entry]]
name = "sys.bits"
kind = "attribute"
signature = "sys.bits"
summary = "Target architecture bits"
description = "The number of bits in a Teascript integer, either 32 or 64 depending on the architecture."
example = '''
import sys

// Check architecture word size
print("Word size: " + sys.bits + " bits")

// Use for bitwise operations
if sys.bits == 64
{
    print("Running on 64-bit architecture")
    var large_number = 1 << 40
    print("Large number:", large_number)
}
else
{
    print("Running on 32-bit architecture")
}
'''

###

[[entry]]
name = "sys.byteorder"
kind = "attribute"
signature = "sys.byteorder"
summary = "Byte order"
description = 'A string representing the byte order of the system, either "little" or "big".'
example = '''
import sys

// Check system byte order
print("Byte order: " + sys.byteorder)

// Handle binary data appropriately
if sys.byteorder == "little"
{
    print("Little-endian system")
}
else
{
    print("Big-endian system")
}

// Practical example: network byte order conversion
var is_little_endian = sys.byteorder == "little"
print("Needs byte swapping for network: " + is_little_endian)
'''

###

[[entry]]
name = "sys.argv"
kind = "attribute"
signature = "sys.argv"
summary = "Command-line arguments"
description = "A list of command-line arguments passed to the Teascript program."
example = '''
import sys

// Print all arguments
print("Arguments:")
for const arg in sys.argv
{
    print("  " + arg)
}

// Check for specific flags
var verbose = false
for const arg in sys.argv
{
    if arg == "--verbose" or arg == "-v"
    {
        verbose = true
    }
}

if verbose
{
    print("Verbose mode enabled")
}

// Access specific arguments
if sys.argv.length > 0
{
    print("First argument: " + sys.argv[0])
}
'''

###

[[entry]]
name = "sys.version"
kind = "attribute"
signature = "sys.version"
summary = "Version map"
description = """
A map containing the version information of the Teascript interpreter.

#### Attributes
- `major`: The major version number
- `minor`: The minor version number
- `patch`: The patch version number
"""
example = '''
import sys

// Display version information
print("Teascript version: " + sys.version.major + "." + sys.version.minor + "." + sys.version.patch)

// Check for minimum version
var required_major = 1
var required_minor = 0

if sys.version.major > required_major or (sys.version.major == required_major and sys.version.minor >= required_minor)
{
    print("Version requirement satisfied")
}
else
{
    print("Please upgrade Teascript")
}

// Feature detection based on version
if sys.version.major >= 2
{
    print("Using modern features")
}
'''

###

[[entry]]
name = "sys.loaders"
kind = "attribute"
signature = "sys.loaders"
summary = "Importer loaders"
description = "A list of module loaders available to the Teascript runtime."
example = '''
import sys

// Display available loaders
print("Available loaders:")
for const loader in sys.loaders
{
    print("  " + loader)
}

// Check loader availability
var has_custom_loader = false
for const loader in sys.loaders
{
    if loader == "custom"
    {
        has_custom_loader = true
    }
}

if has_custom_loader
{
    print("Custom loader is available")
}
'''

###

[[entry]]
name = "sys.exit()"
kind = "function"
signature = "function sys.exit(status)"
summary = "Exit program interpreter"
description = "The function `exit` terminates the program with the given status."
example = '''
import sys

// Exit with success
if condition_met
{
    sys.exit(true)
}

// Exit with failure
if error_occurred
{
    sys.exit(false)
}

// Exit with specific code
if critical_error
{
    sys.exit(42)
}

// Default success exit
sys.exit()
'''

[[entry.params]]
name = "status"
desc = "An optional boolean or integer exit status. If `true` or omitted, exits with success (0). If `false`, exits with failure (1). If an integer, uses that as the exit code."
