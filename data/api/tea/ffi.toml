[[entry]]
name = "ffi.errno"
kind = "function"
signature = "function ffi.errno(value)"
summary = "Gets or sets the C errno value."
description = "Return the current C `errno`. If `value` is supplied, `errno` is set to it, and the value returned is the previous one. Call it immediately after the native call whose status you want to inspect, since other operations may modify `errno`."
returns = "The value of `errno` before any change was made, as a number."
errors = '''
- Raises an error if `value` is given and is not an integer.
'''
example = '''
import ffi

ffi.errno(0)            // clear errno

ffi.cdef("int close(int fd);")
ffi.C.close(-1)         // fails

print(ffi.errno())      // 9 (EBADF) on most systems
'''

[[entry.params]]
name = "value"
desc = "(Optional) A new value to store into `errno`."

