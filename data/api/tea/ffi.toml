[[entry]]
name = "CData"
kind = "class"
signature = "class CData"
summary = "A value living in C memory."
description = """
A value stored in C memory, returned by `ffi.cnew`, `ffi.cast`, `ffi.addressof`, and library function lookups, and by calls returning pointers or records. Scalar values are converted to Teascript numbers or booleans where appropriate.

Pointer and array values are indexed with zero-based integer indices, as in `ptr[i]` and `array[i]`. Pointer access is unchecked.

Record fields are accessed as attributes, as in `record.x`. Pointers to records support the same syntax, as in `ptr.x`. Assignments write through to C memory, and const-qualified data cannot be assigned to. Nested records and arrays are returned as `CData` that refer to the original storage.

C pointers can be compared with other C pointers and with `nil`; a null pointer compares equal to `nil`. Records, arrays, and function values do not compare equal.

Function-pointer data is called directly. Fixed parameters are converted according to the declared prototype. Variadic functions accept additional arguments with the default C promotions: booleans and integers are passed as integers, other numbers as `double`, strings and `nil` as pointers, and records and arrays as pointers to their storage. The call must supply all fixed arguments, and non-variadic functions require exactly the declared number.

`tostring(cdata)` produces a type-and-address representation such as `cdata<int*>: 0x...`.
"""
returns = "A `CData` object."
errors = '''
- Indexing a value that is neither a pointer nor an array raises an error.
- Indexing a `void*` raises an error, and so does indexing with a value that is not a number.
- Accessing a field that does not exist raises an error stating the C type has no such member.
- Accessing an attribute of a value that is neither a record nor a pointer to a record raises an error.
- Assigning to const-qualified data raises an error.
- Calling a value that is not a function pointer raises an error.
- Calling a function with the wrong number of arguments raises an error.
- Passing a value of an unsupported type as a variadic argument raises an error.
- Calling a function whose return type is not supported raises an error.
'''
example = '''
import ffi

ffi.cdef(```
typedef struct {
    int x;
    int y;
} Point;
```)

const p = ffi.cnew("Point", { x = 1, y = 2 })
p.x = p.x + 10
print(p.x, p.y) // 11 2

const ptr = ffi.addressof(p)
print(ptr.y)    // 2
print(ptr == nil) // false

const numbers = ffi.cnew("int[4]", [1, 2, 3, 4])
numbers[0] *= 10
print(numbers[0]) // 10
'''

###

[[entry]]
name = "CType"
kind = "class"
signature = "class CType"
summary = "A description of a C type."
description = """
Describes a C type. A `CType` is accepted wherever a C type declaration can be used, and is returned by `ffi.typeof`. Types are interned, so equal types are represented by the same object, which is what `ffi.istype` relies on.

`tostring(ffi.typeof("int"))` produces `ctype<int>`.

The type parser supports scalar and pointer types, arrays, records (`struct` and `union`), typedefs, function declarations, and variadic function declarations, subject to the types supported by this module and libffi. Common C scalar types and fixed-width integer types such as `int32_t`, `uint64_t`, and `size_t` are predefined.
"""
returns = "A `CType` object."
errors = '''
- Using a string that is not a valid or known C type declaration raises an error.
'''
example = '''
import ffi

const t = ffi.typeof("uint64_t")
print(t)                   // ctype<uint64_t>
print(ffi.sizeof(t))       // 8
print(ffi.typeof(t) == t)  // true
'''

###

[[entry]]
name = "CLib"
kind = "class"
signature = "class CLib"
summary = "A loaded C shared library."
description = """
Represents a shared library, returned by `ffi.load`. The process C library is also available as `ffi.C`.

Reading a declared function name from a `CLib` looks up that symbol in the shared library and returns callable function-pointer `CData`. The result is cached on the library object. The function must have been declared beforehand with `ffi.cdef`, and the declaration must match the actual signature of the symbol in the library.

The library is unloaded when the `CLib` object is collected.
"""
returns = "A `CLib` object."
errors = '''
- Looking up a name that has no prior declaration made by `ffi.cdef` raises an error.
- Looking up a declared name that does not exist in the library raises an error.
'''
example = '''
import os, ffi

assert(os.name == "windows")

ffi.cdef(```
typedef void* HWND;
int MessageBoxA(HWND hWnd, const char* text, const char* caption, unsigned int type);
```)

const user32 = ffi.load("user32")

const MB_OK = 0x00000000
const MB_ICONINFORMATION = 0x00000040

const res = user32.MessageBoxA(
    nil,
    "Hello from Teascript FFI!",
    "Teascript Windows API Example",
    MB_OK | MB_ICONINFORMATION
)

if res == 1
{
    print("User clicked OK")
}
'''
