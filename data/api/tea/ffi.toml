kind = "function"
signature = "function ffi.abi(name)"
summary = "Tests the target ABI."
description = "Return whether the target matches an ABI name. Recognized names are `\"32bit\"`, `\"64bit\"`, `\"le\"` (little-endian), and `\"be\"` (big-endian)."
