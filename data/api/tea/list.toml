[[entry]]
name = "List.find"
kind = "method"
signature = "function List:find(predicate)"
summary = "Find first element"
description = "The `find` method returns the first element in the list for which the predicate function returns `true`. If no element satisfies the predicate, `nil` is returned."
example = '''
var numbers = [1, 3, 5, 8, 9, 12]
var firstEven = numbers.find(function(n) {
    return n % 2 == 0
})
print(firstEven)  // 8

// Finding a specific object
var users = [
    {name ="Alice", age = 30},
    {name ="Bob", age = 25},
    {name ="Charlie", age = 35}
]
var bob = users.find(function(user) {
    return user.name == "Bob"
})
print(bob)  // {name: "Bob", age: 25}

// No match returns nil
var none = numbers.find(function(n) { return n > 100 })
print(none)  // nil
'''

[[entry.params]]
name = "predicate"
desc = "A function that takes an element and returns a boolean."

###

[[entry]]
name = "List.flat"
kind = "method"
signature = "function List:flat()"
summary = "Flatten sub-list elements"
description = "The `flat` method creates a new list with all sub-list elements concatenated into it recursively."
returns = "The method returns a new flattened list."
example = '''
var nested = [1, [2, 3], [4, [5, 6]]]
var flat = nested.flat()
print(flat)  // [1, 2, 3, 4, 5, 6]

// Deeply nested structure
var deep = [[[[1]]], [[2, [3]]]]
print(deep.flat())  // [1, 2, 3]

// Already flat lists remain unchanged
print([1, 2, 3].flat())  // [1, 2, 3]
'''

