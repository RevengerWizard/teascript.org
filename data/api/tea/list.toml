[[entry]]
name = "List.clear"
kind = "method"
signature = "function List:clear()"
summary = "Empty a list"
description = "The `clear` method removes all elements from the list, leaving it empty."
example = '''
var cart = ["laptop", "mouse", "keyboard"]
cart.clear()
print(cart)  // []

// Clearing an already empty list is safe
cart.clear()
print(cart)  // []
'''

