[[entry]]
name = "List.foreach"
kind = "method"
signature = "function List:foreach(action)"
summary = "Callback iterate"
description = "The `foreach` method executes a provided function once for each list element."
example = '''
var fruits = ["apple", "banana", "cherry"]
fruits.foreach(function(fruit) {
    print("I like " + fruit)
})
// Output:
// I like apple
// I like banana
// I like cherry

// Summing with side effects
var total = 0
[10, 20, 30].foreach(function(n) {
    total = total + n
})
print(total)  // 60
'''

[[entry.params]]
name = "action"
desc = "A function to execute for each element."

###

[[entry]]
name = "List.iter"
kind = "method"
signature = "function List:iter()"
summary = "List iterator"
description = "The `iter` method returns an iterator function that can be used to traverse the list. Each call to the iterator returns the next element in the list, or `nil` when the iteration is complete."
example = '''
var colors = ["red", "green", "blue"]
var iter = colors.iter()

print(iter())  // "red"
print(iter())  // "green"
print(iter())  // "blue"
print(iter())  // nil

// Using iter in a while loop
var it = [1, 2, 3].iter()
var value = it()
while value != nil
{
    print(value)
    value = it()
}
// Output: 1 2 3
'''

