[[entry]]
name = "List.join"
kind = "method"
signature = "function List:join(separator=\"\")"
summary = "Join list into string"
description = "The `join` method concatenates all elements of the list into a single string, with an optional separator between each element."
returns = "The method returns a string containing all elements joined together."
example = '''
var words = ["Hello", "world", "from", "Tea"]
print(words.join(" "))   // "Hello world from Tea"
print(words.join("-"))   // "Hello-world-from-Tea"
print(words.join())      // "HelloworldfromTea"

// Joining numbers
var nums = [1, 2, 3, 4, 5]
print(nums.join(", "))   // "1, 2, 3, 4, 5"

// Building a CSV line
var row = ["Alice", "30", "Engineer"]
print(row.join(","))     // "Alice,30,Engineer"
'''

[[entry.params]]
name = "separator"
desc = 'An optional string to place between elements. If not specified, defaults to an empty string `""`.'

