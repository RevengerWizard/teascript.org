[[entry]]
name = "List.sort"
kind = "method"
signature = "function List:sort(comparator=nil)"
summary = "Sort all elements"
description = "The `sort` method sorts the elements of the list in place. If no comparator is provided, the elements are sorted in ascending order (numeric comparison). If a comparator function is provided, it must take two arguments and return `true` if the first should come before the second."
example = '''
var scores = [88, 42, 95, 67, 73]
scores.sort()
print(scores)  // [42, 67, 73, 88, 95]

// Sorting in descending order with a custom comparator
var descending = [3, 1, 4, 1, 5, 9, 2, 6]
descending.sort(function(a, b) {
    return a > b
})
print(descending)  // [9, 6, 5, 4, 3, 2, 1, 1]

// Sorting strings by length
var words = ["banana", "apple", "cherry", "date"]
words.sort(function(a, b) {
    return a.len < b.len
})
print(words)  // ["date", "apple", "banana", "cherry"]
'''

[[entry.params]]
name = "comparator"
desc = "An optional function that takes two elements and returns a boolean indicating their order. If not specified, numerical ascending order is used."

