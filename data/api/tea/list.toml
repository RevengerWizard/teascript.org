[[entry]]
name = "List.count"
kind = "method"
signature = "function List:count(value)"
summary = "Count occurrences of value"
description = "The `count` method counts the number of occurrences of a specified value within the list."
returns = "The method returns the number of times the value appears in the list."
example = '''
var votes = ["yes", "no", "yes", "yes", "abstain", "no"]
print(votes.count("yes"))      // 3
