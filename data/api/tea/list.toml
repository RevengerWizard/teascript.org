[[entry]]
name = "List.contains"
kind = "method"
signature = "function List:contains(value)"
summary = "Check value presence"
description = "The `contains` method checks whether the specified value is present in the list."
returns = "The method returns `true` if the value is found in the list, or `false` otherwise."
example = '''
var inventory = ["sword", "shield", "potion"]
print(inventory.contains("shield"))  // true
print(inventory.contains("bow"))     // false

// Works with different types
var mixed = [1, "two", 3.0, true]
print(mixed.contains("two"))   // true
print(mixed.contains(3))       // false (3 is not 3.0)
print(mixed.contains(true))    // true
'''

[[entry.params]]
name = "value"
desc = "The value to search for within the list."

