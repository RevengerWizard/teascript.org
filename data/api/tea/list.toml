[[entry]]
name = "List.reduce"
kind = "method"
signature = "function List:reduce(accumulator)"
summary = "Reduce new list"
description = "The `reduce` method applies a function against an accumulator and each element of the list (from left to right) to reduce it to a single value. The first element of the list is used as the initial accumulator value."
returns = "The method returns the final accumulated value."
example = '''
var numbers = [1, 2, 3, 4, 5]
var sum = numbers.reduce(function(acc, n) {
    return acc + n
})
print(sum)  // 15

// Finding the maximum value
var values = [3, 7, 2, 9, 4]
var max = values.reduce(function(acc, n) {
    if n > acc { return n }
    return acc
})
print(max)  // 9

// Building a sentence
var words = ["Tea", "is", "delicious"]
var sentence = words.reduce(function(acc, w) {
    return acc + " " + w
})
print(sentence)  // "Tea is delicious"

// Reducing an empty list returns nil
print([].reduce(function(a, b) { return a + b }))  // nil
'''

[[entry.params]]
name = "accumulator"
desc = "A function that takes the accumulator and the current element, and returns the new accumulator value."

