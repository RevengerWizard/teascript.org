[[entry]]
name = "List.reverse"
kind = "method"
signature = "function List:reverse()"
summary = "Reverse list elements order"
description = "The `reverse` method reverses the order of elements in the list in place."
example = '''
var countdown = [5, 4, 3, 2, 1]
countdown.reverse()
print(countdown)  // [1, 2, 3, 4, 5]

var letters = ["a", "b", "c", "d"]
letters.reverse()
print(letters)  // ["d", "c", "b", "a"]

// Reversing a single-element list has no effect
var single = [42]
single.reverse()
print(single)  // [42]
'''

