[[entry]]
name = "List.copy"
kind = "method"
signature = "function List:copy()"
summary = "Get shallow copy"
description = "The `copy` method creates a shallow copy of the list. The new list contains references to the same elements as the original list."
returns = "The method returns a new list containing the same elements as the original."
example = '''
var original = [1, 2, 3]
var duplicate = original.copy()
duplicate.add(4)
print(original)   // [1, 2, 3]
print(duplicate)  // [1, 2, 3, 4]

// Shallow copy: nested lists are shared
var nested = [[1, 2], [3, 4]]
var shallow = nested.copy()
shallow[0].add(99)
print(nested)   // [[1, 2, 99], [3, 4]] (original affected!)
'''

