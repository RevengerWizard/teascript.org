[[entry]]
name = "List.insert"
kind = "method"
signature = "function List:insert(value, index)"
summary = "Insert value at index"
description = "The `insert` method inserts a value at the specified index in the list. All elements at and after that index are shifted up by one position. If the index is out of bounds, an error is raised."
example = '''
var queue = ["first", "third", "fourth"]
queue.insert("second", 1)
print(queue)  // ["first", "second", "third", "fourth"]

queue.insert("zeroth", 0)
print(queue)  // ["zeroth", "first", "second", "third", "fourth"]

// Inserting at the end is equivalent to add
queue.insert("fifth", queue.len - 1)
print(queue)  // ["zeroth", "first", "second", "third", "fourth", "fifth"]
'''

[[entry.params]]
name = "value"
desc = "The value to insert into the list."

[[entry.params]]
name = "index"
desc = "The zero-based index at which to insert the value."

