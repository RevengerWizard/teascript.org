[[entry]]
name = "List.fill"
kind = "method"
signature = "function List:fill(value)"
summary = "Value fill all elements"
description = "The `fill` method replaces every element in the list with the specified value."
example = '''
var grid = [0, 0, 0, 0, 0]
grid.fill(1)
print(grid)  // [1, 1, 1, 1, 1]

var board = ["empty", "empty", "empty"]
board.fill("X")
print(board)  // ["X", "X", "X"]

// Filling with a list reference
