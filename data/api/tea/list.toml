[[entry]]
name = "List.+"
kind = "operator"
signature = "function List:+(other)"
summary = "New concatenated list"
description = "The `+` operator creates a new list by concatenating two lists together."
returns = "The method returns a new list containing all elements from both lists."
example = '''
var a = [1, 2, 3]
var b = [4, 5, 6]
var c = a + b
print(c)  // [1, 2, 3, 4, 5, 6]

// Original lists are unchanged
print(a)  // [1, 2, 3]
print(b)  // [4, 5, 6]

// Chaining concatenations
var combined = [1] + [2] + [3] + [4]
print(combined)  // [1, 2, 3, 4]

// Concatenating with empty lists
print([1, 2] + [])  // [1, 2]
print([] + [3, 4])  // [3, 4]
'''
