[[entry]]
name = "List.extend"
kind = "method"
signature = "function List:extend(other)"
summary = "Concatenate with another list"
description = "The `extend` method appends all elements from another list to the end of the original list."
example = '''
var first = [1, 2, 3]
var second = [4, 5, 6]
first.extend(second)
print(first)  // [1, 2, 3, 4, 5, 6]

// Extending with an empty list does nothing
first.extend([])
print(first)  // [1, 2, 3, 4, 5, 6]

// Merging multiple lists
var combined = ["a"]
combined.extend(["b", "c"])
combined.extend(["d", "e"])
print(combined)  // ["a", "b", "c", "d", "e"]
'''

[[entry.params]]
name = "other"
desc = "The list whose elements will be appended."

