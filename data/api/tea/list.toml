description = "The List class represents an ordered, mutable collection of Teascript values. Its methods support adding, removing, searching, transforming, and iterating over elements."

[[entry]]
name = "List.len"
kind = "attribute"
signature = "List:len"
summary = "Number of elements"
description = "The attribute `len` allows to receive the number of elements in a Tea list."
example = '''
const fruits = ["apple", "banana", "cherry"]
print(fruits.len)  // 3

print([].len)  // 0
'''

###

[[entry]]
name = "List.new"
kind = "method"
signature = "function List:new(size=0)"
summary = "Create new list"
description = "The `new` method creates a new list, optionally pre-allocated with a given size. This is useful when you know in advance how many elements the list will hold, as it can improve performance by reducing the number of internal reallocations."
example = '''
var empty = List:new()
print(empty.len)  // 0

var preallocated = List:new(10)
print(preallocated.len)  // 0, but capacity is pre-allocated

// Building a list of squares with known size
var squares = List:new(5)
for const i in 1..5
{
    squares.add(i * i)
}
print(squares)  // [1, 4, 9, 16, 25]
'''

[[entry.params]]
name = "size"
desc = "An optional number indicating the initial capacity of the list. If not specified, defaults to `0`."

###

[[entry]]
name = "List.add"
kind = "method"
signature = "function List:add(value, ...)"
summary = "Append values"
description = "The `add` method appends one or more values to the end of the list."
returns = "The method returns the list itself, allowing for method chaining."
example = '''
var shopping = ["milk", "eggs"]
shopping.add("bread")
print(shopping)  // ["milk", "eggs", "bread"]

// Add multiple items at once
shopping.add("butter", "cheese", "jam")
print(shopping)  // ["milk", "eggs", "bread", "butter", "cheese", "jam"]

// Chaining
var nums = [1, 2]
nums.add(3).add(4).add(5)
print(nums)  // [1, 2, 3, 4, 5]
'''

[[entry.params]]
name = "value"
desc = "The first value to append to the list."

[[entry.params]]
name = "..."
desc = "Additional values to append, if any."

###

[[entry]]
name = "List.remove"
kind = "method"
signature = "function List:remove(value)"
summary = "Remove specific value"
description = "The `remove` method removes the first occurrence of a specified value from the list. If the value is not found, an error is raised."
example = '''
var guests = ["Alice", "Bob", "Charlie", "Bob"]
guests.remove("Bob")
print(guests)  // ["Alice", "Charlie", "Bob"] (only first Bob removed)

guests.remove("Charlie")
print(guests)  // ["Alice", "Bob"]

// Removing a non-existent value raises an error
// guests.remove("Dave")  // Error: Value does not exist within the list
'''

[[entry.params]]
name = "value"
desc = "The value to remove from the list."

###

[[entry]]
name = "List.delete"
kind = "method"
signature = "function List:delete(index)"
summary = "Delete element at index"
description = "The `delete` method removes the element at the specified index from the list. All subsequent elements are shifted down by one position. If the index is out of bounds, an error is raised."
example = '''
var playlist = ["Song A", "Song B", "Song C", "Song D"]
playlist.delete(1)
print(playlist)  // ["Song A", "Song C", "Song D"]

playlist.delete(0)
print(playlist)  // ["Song C", "Song D"]

// Deleting from an empty list is a no-op
var empty = []
empty.delete(0)
print(empty)  // []

// Out-of-bounds access raises an error
// playlist.delete(10)  // Error: Index out of bounds
'''

[[entry.params]]
name = "index"
desc = "The zero-based index of the element to remove."

