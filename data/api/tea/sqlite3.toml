[[entry]]
name = "Database.query"
kind = "method"
signature = "function Database.query(sql, params)"
summary = "Runs a query and returns all rows."
description = "Prepare and execute the first statement in `sql` and collect every resulting row. Each row is a map from column name to value. Use column aliases in the query to control the keys."
returns = "A list of maps, one per row, which is empty if the query returns no rows."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `sql` is not a string.
- Raises an error if `params` is neither a list nor a map.
- Raises an error if a parameter has an unsupported type, such as a list, map or function.
- Raises an error with SQLite's error message if the statement cannot be prepared or fails during execution.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec(```
CREATE TABLE users (name TEXT, age INTEGER);
INSERT INTO users VALUES ('Ada', 37), ('Grace', 85), ('Tim', 12);```)

const adults = db.query("SELECT name, age FROM users WHERE age >= ? ORDER BY age", [18])

for const user in adults
{
    print(user["name"], user["age"])
}
'''

