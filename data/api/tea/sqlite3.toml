title = "SQLite3"
kind = "module"
origin = "bundled"
since = "1.0"
summary = "Embedded SQL database access through SQLite: open databases, run queries with bound parameters, use prepared statements and transactions."

###

[[entry]]
name = "sqlite3.open"
kind = "function"
signature = "function sqlite3.open(path, opts)"
summary = "Opens a SQLite database."
description = """
Open the SQLite database at `path` and return a `Database` object. Use `":memory:"` for a temporary in-memory database. By default the database is opened read-write and the file is created if it does not exist.

The optional `opts` map currently recognizes a single key, `readonly`. When it is true, the database is opened read-only and is not created. Any other keys are ignored.
"""
returns = "A `Database` object."
errors = '''
- Raises an error if `path` is not a string.
- Raises an error with SQLite's error message if the database cannot be opened, such as a missing file in read-only mode or a path that cannot be created.
'''
example = '''
import sqlite3

// Read-write database, created on demand
const db = sqlite3.open("app.db")
db.close()

// Temporary database that lives in memory
const memory = sqlite3.open(":memory:")
memory.close()

// Existing database, opened read-only
const reader = sqlite3.open("existing.db", { readonly = true })
reader.close()
'''

[[entry.params]]
name = "path"
desc = "The path of the database file, or `\":memory:\"` for an in-memory database."

[[entry.params]]
name = "opts"
desc = "(Optional) A map of options. Currently only `readonly` is recognized; when `true`, the database is opened read-only."

###

[[entry]]
name = "Database"
kind = "class"
signature = "class Database"
summary = "An open SQLite database connection."
description = """
Represents an open SQLite database, returned by `sqlite3.open`. All operations are methods of the object, as in `db.query(...)`.

Parameters for `run`, `query`, `row`, `value` and the `Statement` methods can be given as a list for positional placeholders or as a map for named placeholders. The supported placeholder forms are SQLite's `?`, `:name`, `@name` and `$name`. For named placeholders, the map keys omit the placeholder prefix: use `name` for `:name`, `@name` or `$name`. Positional values are matched to placeholders in order. Missing named values and omitted positional values are left unbound, which SQLite treats as `NULL`, and extra positional values are ignored.

Values read from the database are converted as follows: `NULL` becomes `nil`; `INTEGER` and `REAL` become numbers (very large 64-bit integers may not be exactly representable); `TEXT` and `BLOB` become strings, preserving embedded NUL bytes. When binding, `nil`, booleans, numbers and strings are supported. Booleans bind as the integers `0` and `1`, numbers bind as floating-point values, and strings bind as `TEXT`. There is no way to bind a `BLOB`.

The database is closed automatically when the object is collected. Call `close` to release it at a specific point.
"""
returns = "A `Database` object."
errors = '''
- Calling any method on a database that has been closed raises an error stating that the database is closed.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")

db.exec("CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER)")

// Positional parameters
db.run("INSERT INTO users(name, age) VALUES (?, ?)", ["Ada", 37])

// Named parameters
db.run("INSERT INTO users(name, age) VALUES (:name, :age)", { name = "Grace", age = 85 })

for const user in db.query("SELECT name, age FROM users ORDER BY name")
{
    print(user["name"], user["age"])
}

db.close()
'''

