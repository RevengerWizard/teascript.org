[[entry]]
name = "Statement.query"
kind = "method"
signature = "function Statement.query(params)"
summary = "Executes the prepared statement and returns all rows."
description = "Reset the statement, bind `params`, execute it, and collect every resulting row. Each row is a map from column name to value."
returns = "A list of maps, one per row, which is empty if the statement returns no rows."
errors = '''
- Raises an error if the statement has been finalized.
- Raises an error if `params` is neither a list nor a map.
- Raises an error if a parameter has an unsupported type, such as a list, map or function.
- Raises an error with SQLite's error message if execution fails.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec(```
CREATE TABLE titles (name TEXT, year INTEGER);
INSERT INTO titles VALUES ('Arrival', 2016), ('Severance', 2022), ('Spirited Away', 2001);```)

const since = db.prepare("SELECT name FROM titles WHERE year >= ? ORDER BY year")

for const title in since.query([2010])
{
    print(title["name"])
}

since.finalize()
'''

[[entry.params]]
name = "params"
desc = "(Optional) A list of positional values or a map of named values to bind to the placeholders."

