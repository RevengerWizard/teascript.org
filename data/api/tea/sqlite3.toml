[[entry]]
name = "Database.exec"
kind = "method"
signature = "function Database.exec(sql)"
summary = "Executes one or more SQL statements."
description = "Execute one or more SQL statements separated by semicolons. Result rows are discarded and parameters cannot be bound. Use it for schema setup and scripts; use `run` or `query` when parameters or results are needed."
returns = "Nothing."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `sql` is not a string.
- Raises an error with SQLite's error message if a statement fails. Statements executed before the failing one are not undone.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")

db.exec(```
CREATE TABLE categories (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE);
INSERT INTO categories(name) VALUES ('films'), ('series'), ('anime');```)

print(db.value("SELECT count(*) FROM categories")) // 3
'''

[[entry.params]]
name = "sql"
desc = "A string with one or more SQL statements."

###

[[entry]]
name = "Database.run"
kind = "method"
signature = "function Database.run(sql, params)"
summary = "Executes a statement and reports its effect."
description = "Prepare and execute the first statement in `sql`, consuming any rows it returns. Only the first statement of the string is executed; use `exec` for scripts with several statements. Intended for statements such as `INSERT`, `UPDATE` and `DELETE`."
returns = "A map with two keys: `changes`, the number of rows modified by the most recent statement, and `last_id`, the row ID of the most recently inserted row."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `sql` is not a string.
- Raises an error if `params` is neither a list nor a map.
- Raises an error if a parameter has an unsupported type, such as a list, map or function.
- Raises an error with SQLite's error message if the statement cannot be prepared or fails during execution, for example because of a syntax error or a violated constraint.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT)")

const result = db.run("INSERT INTO users(name) VALUES (?)", ["Ada"])
print(result["changes"]) // 1
print(result["last_id"]) // 1

db.run("UPDATE users SET name = :name WHERE id = :id", { name = "Ada Lovelace", id = 1 })
'''

[[entry.params]]
name = "sql"
desc = "A string with the SQL statement to execute."

[[entry.params]]
name = "params"
desc = "(Optional) A list of positional values or a map of named values to bind to the placeholders."

