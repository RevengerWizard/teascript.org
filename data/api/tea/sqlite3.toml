[[entry]]
name = "Database.row"
kind = "method"
signature = "function Database.row(sql, params)"
summary = "Returns the first row of a query."
description = "Prepare and execute the first statement in `sql` and return only its first row as a map from column name to value. Remaining rows are ignored."
returns = "A map with the first row, or `nil` if the query returns no rows."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `sql` is not a string.
- Raises an error if `params` is neither a list nor a map.
- Raises an error if a parameter has an unsupported type, such as a list, map or function.
- Raises an error with SQLite's error message if the statement cannot be prepared or fails during execution.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec(```
CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, age INTEGER);
INSERT INTO users(name, age) VALUES ('Ada', 37);```)

const user = db.row("SELECT * FROM users WHERE name = :name", { name = "Ada" })

if user != nil
{
    print(user["id"], user["age"])
}

print(db.row("SELECT * FROM users WHERE name = ?", ["Nobody"])) // nil
'''

