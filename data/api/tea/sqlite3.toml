[[entry]]
name = "Statement.finalize"
kind = "method"
signature = "function Statement.finalize()"
summary = "Releases the prepared statement."
description = "Release the prepared statement. Calling `finalize` on a statement that is already finalized does nothing. Any other use of a finalized statement raises an error."
returns = "Nothing."
errors = '''
- Does not raise errors when called again on a finalized statement.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE logs (message TEXT)")

const insert = db.prepare("INSERT INTO logs(message) VALUES (?)")
insert.run(["started"])

insert.finalize()
insert.finalize() // safe, does nothing

db.close()
'''
