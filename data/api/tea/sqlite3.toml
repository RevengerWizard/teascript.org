[[entry]]
name = "Database.prepare"
kind = "method"
signature = "function Database.prepare(sql)"
summary = "Prepares a reusable statement."
description = "Compile the first statement in `sql` into a reusable `Statement`. Preparing a statement once and running it many times with different parameters avoids parsing the SQL again. Only the first statement of the string is prepared."
returns = "A `Statement` object."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `sql` is not a string.
- Raises an error with SQLite's error message if the statement cannot be prepared, such as a syntax error or a reference to a table that does not exist.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE logs (message TEXT)")

const insert = db.prepare("INSERT INTO logs(message) VALUES (?)")
insert.run(["started"])
insert.run(["finished"])
insert.finalize()

print(db.value("SELECT count(*) FROM logs")) // 2
'''

[[entry.params]]
name = "sql"
desc = "A string with the SQL statement to prepare."

###

[[entry]]
name = "Database.transaction"
kind = "method"
signature = "function Database.transaction(fn)"
summary = "Runs a function inside a transaction."
description = "Begin a transaction, call `fn` with no arguments, and commit when it returns. If `fn` raises an error, the transaction is rolled back and the error is raised again. Transactions cannot be nested."
returns = "Nothing."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `fn` is not a function.
- Raises an error with SQLite's error message if the transaction cannot begin, for example because one is already active.
- Re-raises any error raised by `fn`, after rolling back the transaction.
- Raises an error with SQLite's error message if the commit fails, after rolling back the transaction.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE accounts (name TEXT)")

db.transaction(function() {
    db.run("INSERT INTO accounts(name) VALUES (?)", ["checking"])
    db.run("INSERT INTO accounts(name) VALUES (?)", ["savings"])
})

print(db.value("SELECT count(*) FROM accounts")) // 2
'''

[[entry.params]]
name = "fn"
desc = "A function called with no arguments that performs the database operations of the transaction."

###

[[entry]]
name = "Database.begin"
kind = "method"
signature = "function Database.begin()"
summary = "Begins a transaction."
description = "Begin a transaction using SQLite's default transaction behavior. The transaction stays open until `commit` or `rollback` is called. Prefer `transaction` when the work fits in a function, as it ends the transaction automatically."
returns = "Nothing."
errors = '''
- Raises an error if the database is closed.
- Raises an error with SQLite's error message if the transaction cannot begin, for example because one is already active.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE items (name TEXT)")

db.begin()
db.run("INSERT INTO items(name) VALUES (?)", ["first"])
db.commit()
'''

###

[[entry]]
name = "Database.commit"
kind = "method"
signature = "function Database.commit()"
summary = "Commits the current transaction."
description = "Commit the transaction started with `begin`, making its changes permanent."
returns = "Nothing."
errors = '''
- Raises an error if the database is closed.
- Raises an error with SQLite's error message if there is no active transaction or the commit fails.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE items (name TEXT)")

db.begin()
db.run("INSERT INTO items(name) VALUES (?)", ["kept"])
db.commit()

print(db.value("SELECT count(*) FROM items")) // 1
'''

###

[[entry]]
name = "Database.rollback"
kind = "method"
signature = "function Database.rollback()"
summary = "Rolls back the current transaction."
description = "Roll back the transaction started with `begin`, discarding its changes."
returns = "Nothing."
errors = '''
- Raises an error if the database is closed.
- Raises an error with SQLite's error message if there is no active transaction or the rollback fails.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE items (name TEXT)")

db.begin()
db.run("INSERT INTO items(name) VALUES (?)", ["discarded"])
db.rollback()

print(db.value("SELECT count(*) FROM items")) // 0
'''

###

[[entry]]
name = "Database.close"
kind = "method"
signature = "function Database.close()"
summary = "Closes the database."
description = "Close the database and release its resources. Calling `close` on a database that is already closed does nothing. Any other operation on a closed database raises an error. All prepared statements should be finalized before closing."
returns = "Nothing."
errors = '''
- Raises an error with SQLite's error message if the database cannot be closed, for example because of statements that have not been finalized. The database remains open in that case.
'''
example = '''
import sqlite3

const db = sqlite3.open("app.db")

// ... use the database ...

db.close()
db.close() // safe, does nothing
'''

###

[[entry]]
name = "Statement"
kind = "class"
signature = "class Statement"
summary = "A prepared SQL statement that can be run repeatedly."
description = """
Represents a compiled SQL statement, returned by `Database.prepare`. Each execution first resets the statement and clears its previous bindings, and then binds the parameters that were passed, so the same statement can be run any number of times with different values. Parameters follow the same rules as for `Database` methods.

The statement is finalized automatically when the object is collected. Call `finalize` to release it at a specific point, in particular before closing the database.
"""
returns = "A `Statement` object."
errors = '''
- Calling any method other than `finalize` on a statement that has been finalized raises an error stating that the statement is finalized.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE users (name TEXT, age INTEGER)")

const insert = db.prepare("INSERT INTO users(name, age) VALUES (:name, :age)")
insert.run({ name = "Ada", age = 37 })
insert.run({ name = "Grace", age = 85 })
insert.finalize()

const select = db.prepare("SELECT name FROM users WHERE age > ?")
print(select.query([50]).len)
select.finalize()
'''

###

[[entry]]
name = "Statement.run"
kind = "method"
signature = "function Statement.run(params)"
summary = "Executes the prepared statement."
description = "Reset the statement, bind `params`, and execute it, consuming any rows it returns."
returns = "A map with two keys: `changes`, the number of rows modified by the most recent statement, and `last_id`, the row ID of the most recently inserted row."
errors = '''
- Raises an error if the statement has been finalized.
- Raises an error if `params` is neither a list nor a map.
- Raises an error if a parameter has an unsupported type, such as a list, map or function.
- Raises an error with SQLite's error message if execution fails, for example because of a violated constraint.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec("CREATE TABLE logs (message TEXT)")

const insert = db.prepare("INSERT INTO logs(message) VALUES (?)")

const first = insert.run(["started"])
print(first["last_id"]) // 1

const second = insert.run(["finished"])
print(second["last_id"]) // 2

insert.finalize()
'''

[[entry.params]]
name = "params"
desc = "(Optional) A list of positional values or a map of named values to bind to the placeholders."

