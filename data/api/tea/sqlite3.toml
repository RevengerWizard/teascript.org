[[entry]]
name = "Database.value"
kind = "method"
signature = "function Database.value(sql, params)"
summary = "Returns the first column of the first row."
description = "Prepare and execute the first statement in `sql` and return the value of the first column of the first row. Useful for scalar queries such as `count(*)` or an ID lookup."
returns = "The value of the first column of the first row, converted to a Teascript value, or `nil` if the query returns no rows or the value is `NULL`."
errors = '''
- Raises an error if the database is closed.
- Raises an error if `sql` is not a string.
- Raises an error if `params` is neither a list nor a map.
- Raises an error if a parameter has an unsupported type, such as a list, map or function.
- Raises an error with SQLite's error message if the statement cannot be prepared or fails during execution.
'''
example = '''
import sqlite3

const db = sqlite3.open(":memory:")
db.exec(```
CREATE TABLE categories (id INTEGER PRIMARY KEY, name TEXT);
INSERT INTO categories(name) VALUES ('films'), ('anime');```)

print(db.value("SELECT count(*) FROM categories"))                  // 2
print(db.value("SELECT id FROM categories WHERE name = ?", ["anime"])) // 2
print(db.value("SELECT id FROM categories WHERE name = ?", ["none"]))  // nil
'''

