<!DOCTYPE html>
<html lang="{{ site.Language }}">

<head>
    {{ partial "head.html" . }}
</head>

<body class="
{{- print "list" -}}
{{- if eq site.Params.defaultTheme `dark` -}}
{{- print " dark" }}
{{- end -}}
{{- if eq .Params.stickyHeader false -}}
{{- print " no-sticky-header" }}
{{- end -}}
">
    {{ partialCached "header.html" . .Section }}
    {{ block "main" . }}{{ end }}
    {{ partialCached "footer.html" . }}
</body>

</html>
