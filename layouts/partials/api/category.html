{{ $data := index site.Data.api.c .Params.apiData }}
<div class="page-layout page-api page-api-category"><aside class="sidebar api-sidebar"><button class="sidebar-close" type="button" aria-label="Close navigation">{{ (resources.Get "svg/x.svg").Content | safeHTML }}</button>{{ partial "sidebar.html" (dict "currentPage" . "apiMode" "c") }}</aside><main class="page-main api-main"><article class="post-single"><header class="post-header"><div class="post-title-row"><button class="sidebar-toggle" type="button" aria-controls="page-sidebar" aria-expanded="false" aria-label="Open navigation"><span class="sidebar-toggle-open">{{ (resources.Get "svg/three-dots.svg").Content | safeHTML }}</span><span class="sidebar-toggle-close">{{ (resources.Get "svg/x.svg").Content | safeHTML }}</span></button><h1 class="post-title">{{ $data.title }}</h1></div></header><div class="post-content"><div class="api-category-summary">{{ $data.description | markdownify }}</div>{{ range $data.entry }}{{ partial "api/entry.html" (merge . (dict "isC" true "apiCategory" $.Params.apiData)) }}{{ end }}</div></article></main></div>
