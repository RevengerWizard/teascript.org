{{/* $sample := readFile "assets/hello.tea" */}}
{{/* highlight $sample "js" */}}

<select id="snippet" class="snippet-select" onchange="snippet(this.value)">
    {{ range .Site.Data.examples }}
    <option value="{{ .file }}">{{ .title }}</option>
    {{ end }}
</select>
<div class="highlight homepage-snippet">
<a class="homepage-snippet__play" href="/play/" aria-label="Open this example in Teascript Play" title="Open in Play">
    {{ (resources.Get "svg/play.svg").Content | safeHTML }}
</a>
<pre class="chroma external"><code class="language-js external" id="external-code">loading...</code></pre>
</div>
<script>
const codeBlock = document.getElementById('external-code');
const playLink = document.querySelector('.homepage-snippet__play');

playLink.addEventListener('click', async event => {
    event.preventDefault();
    const code = codeBlock.textContent;
    try {
        const value = window.encodePlayCodeParam ? await window.encodePlayCodeParam(code) : encodeURIComponent(code);
        window.location.href = `/play/?code=${value}`;
        return;
    } catch (err) {
        console.error('Could not compress example for Play:', err);
    }
    window.location.href = `/play/?code=${encodeURIComponent(code)}`;
});


async function snippet(file)
{
    try
    {
        const response = await fetch(`https://raw.githubusercontent.com/RevengerWizard/teascript/master/example/${file}`);
        const data = await response.text();
        codeBlock.textContent = data.trim();
        codeBlock.removeAttribute('data-highlighted');
        hljs.highlightElement(codeBlock);
    }
    catch(err)
    {
        console.error('Error loading example:', err);
    }
}
const select = document.getElementById('snippet');
const options = select.options;
const idx = Math.floor(Math.random() * options.length);
window.addEventListener('load', () => {
    select.selectedIndex = idx;
    snippet(select.value);
});
</script>
